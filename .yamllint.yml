ignore: |
  .yamllint.yml
  **/*.tpl
  **/*.gotmpl
extends: default
rules:
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 0
  comments:
    min-spaces-from-content: 1
  document-start: disable
  indentation:
    spaces: 2
    indent-sequences: consistent
  line-length: disable
  truthy:
    allowed-values: ["true", "false", "on"]
    check-keys: false
