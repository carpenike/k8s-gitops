---
# Not reconciled. Copy next to a Hermes bot's own ks.yaml to give it a
# Matrix account. BOT_NAME "pilot" makes @hermes-pilot:ryanholt.net and
# Secret hermes-pilot-matrix in BOT_NAMESPACE, with keys MATRIX_HOMESERVER,
# MATRIX_USER_ID, and MATRIX_ACCESS_TOKEN. Depend on the Kustomization that
# creates BOT_NAMESPACE. force replaces the immutable Job when the template
# changes. See docs/matrix.md.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hermes-pilot-matrix
  namespace: flux-system
spec:
  dependsOn:
    - name: hermes-bot-provisioner
      namespace: flux-system
  force: true
  interval: 1h
  path: ./kubernetes/apps/matrix/hermes-bot-provisioner/template
  postBuild:
    substitute:
      BOT_NAME: pilot
      BOT_NAMESPACE: hermes
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  timeout: 15m
