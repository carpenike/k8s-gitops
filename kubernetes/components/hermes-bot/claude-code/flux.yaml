---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# The screen pod's LiteLLM key for Claude Code: the shared key template
# (kubernetes/apps/litellm/key-provisioner/template) with values of its own.
# BOT_NAME and the budget are filled by this component's replacements.
# Secret claude-code-litellm, key litellm_key, is mounted into the screen
# pod only (kubernetes/components/hermes-bot/app, persistence claude-code).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: claude-code-key
spec:
  dependsOn:
    - name: litellm-key-provisioner
      namespace: litellm
  force: true
  interval: 1h
  path: ./kubernetes/apps/litellm/key-provisioner/template
  postBuild:
    substitute:
      KEY_ALIAS: hermes-BOT_NAME-claude-code
      TEAM_ALIAS: hermes
      # The proxy's Claude routes, which Claude Code's managed settings map
      # its opus, sonnet and haiku aliases to (images/hermes-screen).
      MODELS: claude-opus,claude-sonnet,claude-haiku
      BUDGET: CLAUDE_CODE_BUDGET_USD/LLM_BUDGET_DURATION
      TARGET_NAMESPACE: hermes-BOT_NAME
      SECRET_NAME: claude-code-litellm
      SECRET_KEY_NAME: litellm_key
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  timeout: 15m
