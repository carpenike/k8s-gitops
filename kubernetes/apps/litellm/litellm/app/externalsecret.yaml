---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Item litellm in vault k8s-secrets. Field names are the 1Password fields.
# DATABASE_URL percent-encodes the password. The role password secret for
# CloudNativePG is litellm-db in cnpg-system and uses the same field raw.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-env
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: litellm-env
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgresql://litellm:{{ .database_password | urlquery }}@postgres17-rw.cnpg-system.svc.cluster.local:5432/litellm"
        LITELLM_MASTER_KEY: "{{ .master_key }}"
        LITELLM_SALT_KEY: "{{ .salt_key }}"
        ANTHROPIC_API_KEY: "{{ .anthropic_api_key }}"
        OPENAI_API_KEY: "{{ .openai_api_key }}"
        GOOGLE_API_KEY: "{{ .google_api_key }}"
        AZURE_API_KEY: "{{ .azure_api_key }}"
        COPILOT_API_KEY: "{{ .copilot_api_key }}"
        GENERIC_CLIENT_SECRET: "{{ .oidc_client_secret }}"
  data:
    - secretKey: database_password
      remoteRef:
        key: litellm/database_password
    - secretKey: master_key
      remoteRef:
        key: litellm/master_key
    - secretKey: salt_key
      remoteRef:
        key: litellm/salt_key
    - secretKey: anthropic_api_key
      remoteRef:
        key: litellm/anthropic_api_key
    - secretKey: openai_api_key
      remoteRef:
        key: litellm/openai_api_key
    - secretKey: google_api_key
      remoteRef:
        key: litellm/google_api_key
    - secretKey: azure_api_key
      remoteRef:
        key: litellm/azure_api_key
    - secretKey: copilot_api_key
      remoteRef:
        key: litellm/copilot_api_key
    - secretKey: oidc_client_secret
      remoteRef:
        key: litellm/oidc_client_secret
