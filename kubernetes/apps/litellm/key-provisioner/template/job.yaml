---
# Idempotent: with a valid stored key it only reconciles models and budget,
# and the key value does not change. Jobs are immutable, so the consumer's
# Flux Kustomization sets force: true to replace this one when the
# template or a substitution changes.
apiVersion: batch/v1
kind: Job
metadata:
  name: litellm-key-${KEY_ALIAS}
  namespace: litellm
  labels:
    app.kubernetes.io/name: litellm-key-provisioner
    app.kubernetes.io/instance: ${KEY_ALIAS}
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm-key-provisioner
        app.kubernetes.io/instance: ${KEY_ALIAS}
    spec:
      serviceAccountName: litellm-key-${KEY_ALIAS}
      # Never, so each failed attempt keeps its pod and logs. With
      # OnFailure the Job deletes the pod when it gives up.
      restartPolicy: Never
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provision
          # Debian (glibc), not Alpine. Pods search holthome.net last, and
          # Cloudflare and the router answer NODATA for any name under it.
          # musl stops at that NODATA, so an Alpine pod cannot resolve
          # x.ns.svc.cluster.local or any public name; glibc keeps going.
          image: docker.io/library/python:3.15.2-slim-trixie@sha256:e97b88e416c3c01eb427b21fd8cd3ebf006e6ee38afcfcc3cae1c54ee2ab0a75
          command:
            - python3
            - /opt/provision/provision-key.py
          env:
            - name: KEY_ALIAS
              value: ${KEY_ALIAS}
            - name: TEAM_ALIAS
              value: ${TEAM_ALIAS}
            - name: MODELS
              value: ${MODELS}
            - name: BUDGET
              value: ${BUDGET}
            - name: TARGET_NAMESPACE
              value: ${TARGET_NAMESPACE}
            - name: SECRET_NAME
              value: ${SECRET_NAME}
            - name: SECRET_KEY_NAME
              value: ${SECRET_KEY_NAME:=LITELLM_API_KEY}
            - name: LITELLM_URL
              value: http://litellm.litellm.svc.cluster.local:4000
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-env
                  key: LITELLM_MASTER_KEY
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          volumeMounts:
            - name: script
              mountPath: /opt/provision
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: litellm-key-provisioner
