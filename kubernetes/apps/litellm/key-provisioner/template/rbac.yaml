---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: litellm-key-${KEY_ALIAS}
  namespace: litellm
  labels:
    app.kubernetes.io/name: litellm-key-provisioner
    app.kubernetes.io/instance: ${KEY_ALIAS}
---
# One Secret by name, get and patch only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: litellm-key-${KEY_ALIAS}
  namespace: ${TARGET_NAMESPACE}
  labels:
    app.kubernetes.io/name: litellm-key-provisioner
    app.kubernetes.io/instance: ${KEY_ALIAS}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - ${SECRET_NAME}
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: litellm-key-${KEY_ALIAS}
  namespace: ${TARGET_NAMESPACE}
  labels:
    app.kubernetes.io/name: litellm-key-provisioner
    app.kubernetes.io/instance: ${KEY_ALIAS}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: litellm-key-${KEY_ALIAS}
subjects:
  - kind: ServiceAccount
    name: litellm-key-${KEY_ALIAS}
    namespace: litellm
