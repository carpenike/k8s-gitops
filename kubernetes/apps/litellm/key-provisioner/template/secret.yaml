---
# Empty on purpose, as in matrix/hermes-bot-provisioner: RBAC cannot limit
# create by name, so Flux creates it once (IfNotPresent) and the Job only
# gets get and patch.
apiVersion: v1
kind: Secret
metadata:
  name: ${SECRET_NAME}
  namespace: ${TARGET_NAMESPACE}
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
  labels:
    app.kubernetes.io/name: litellm-key-provisioner
    app.kubernetes.io/instance: ${KEY_ALIAS}
type: Opaque
