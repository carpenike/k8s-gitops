---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Shared part of LiteLLM key provisioning: the script and its network
# policy. Each consumer adds a Flux Kustomization on ./template, like
# kubernetes/apps/hermes/chief/ks.yaml (chief-litellm). No postBuild
# substitution here: the script is Python. See docs/apps/litellm.md.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: litellm-key-provisioner
spec:
  dependsOn:
    - name: litellm
      namespace: litellm
  interval: 1h
  path: ./kubernetes/apps/litellm/key-provisioner/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: litellm
