---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The chart's existingSecret (envFrom on the server). postgres-password is the
# key the chart reads; it splices it into HINDSIGHT_API_DATABASE_URL unescaped,
# so it is URL-encoded here, as litellm's DATABASE_URL is. PGPASSWORD (raw) is
# for the backup job. Item hindsight, field database_password: the same value
# the CNPG role uses (cnpg-system/hindsight-db).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hindsight-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: hindsight-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        postgres-password: "{{ .database_password | urlquery }}"
        PGPASSWORD: "{{ .database_password }}"
  data:
    - secretKey: database_password
      remoteRef:
        key: hindsight/database_password
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Tenant keys for the static-keys extension: user:key pairs, one per bot,
# listed explicitly. User <bot> gets schema user_<bot>. Each key is field
# hindsight_api_key of the bot's own 1Password item (hermes-<bot>), the same
# value the bot reads (component input HINDSIGHT_ENABLED). Keys must be ASCII
# without commas. Adding a bot: one data entry and one ",<bot>:{{ .<bot> }}".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hindsight-tenants
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: hindsight-tenants
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        HINDSIGHT_API_TENANT_USERS: "chief:{{ .chief }},hank:{{ .hank }}"
  data:
    - secretKey: chief
      remoteRef:
        key: hermes-chief/hindsight_api_key
    - secretKey: hank
      remoteRef:
        key: hermes-hank/hindsight_api_key
