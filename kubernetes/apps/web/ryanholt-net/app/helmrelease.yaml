---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Static site for the ryanholt.net apex. The page lives in this file as a
# ConfigMap, so an edit is a commit and Reloader rolls the pods. A larger
# site would ship as its own image instead; see docs/website.md.
# /.well-known/matrix/ on the same host is a separate, longer-prefix route
# in namespace matrix and never reaches this pod.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ryanholt-net
spec:
  chartRef:
    kind: OCIRepository
    name: ryanholt-net
  interval: 1h
  values:
    controllers:
      ryanholt-net:
        replicas: 2
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/nginxinc/nginx-unprivileged
              # renovate: datasource=docker depName=docker.io/nginxinc/nginx-unprivileged
              tag: 1.31.7-alpine3.24@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
            env:
              NGINX_ENTRYPOINT_QUIET_LOGS: "1"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                cpu: 200m
                memory: 64Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        ports:
          http:
            port: 8080
    configMaps:
      nginx:
        data:
          default.conf: |-
            server {
                listen 8080;
                server_name _;
                root /usr/share/nginx/html;
                server_tokens off;

                add_header X-Content-Type-Options nosniff always;
                add_header Referrer-Policy strict-origin-when-cross-origin always;
                add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

                location = /healthz {
                    access_log off;
                    default_type text/plain;
                    return 200 "ok\n";
                }

                location / {
                    try_files $uri $uri/ =404;
                }

                error_page 404 /404.html;
            }
      site:
        data:
          index.html: |-
            <!doctype html>
            <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>Ryan Holt</title>
              <style>
                :root { color-scheme: light dark; --fg: #1d1d1f; --muted: #6e6e73; --bg: #fbfbfd; }
                @media (prefers-color-scheme: dark) { :root { --fg: #f5f5f7; --muted: #a1a1a6; --bg: #111113; } }
                html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
                body { display: grid; place-items: center; font: 18px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
                main { padding: 0 16px; max-width: 36rem; }
                h1 { font-size: 2.5rem; margin: 0 0 .25rem; letter-spacing: -.02em; }
                p { margin: 0; color: var(--muted); }
              </style>
            </head>
            <body>
              <main>
                <h1>Ryan Holt</h1>
                <p>ryanholt.net</p>
              </main>
            </body>
            </html>
          404.html: |-
            <!doctype html>
            <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>Not found</title>
              <style>
                :root { color-scheme: light dark; }
                body { display: grid; place-items: center; min-height: 100vh; margin: 0; font: 18px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
              </style>
            </head>
            <body><p>Not found. <a href="/">ryanholt.net</a></p></body>
            </html>
    persistence:
      nginx:
        type: configMap
        identifier: nginx
        globalMounts:
          - path: /etc/nginx/conf.d/default.conf
            subPath: default.conf
            readOnly: true
      site:
        type: configMap
        identifier: site
        globalMounts:
          - path: /usr/share/nginx/html
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
