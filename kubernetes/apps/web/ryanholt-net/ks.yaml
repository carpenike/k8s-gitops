---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# No postBuild substitution: the hostnames are the literal public zone, and
# the page is HTML that should not be scanned for ${...}.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ryanholt-net
spec:
  dependsOn:
    - name: envoy-gateway
      namespace: network
    - name: cloudflare-dns
      namespace: network
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: ryanholt-net
      namespace: web
  interval: 1h
  path: ./kubernetes/apps/web/ryanholt-net/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: web
