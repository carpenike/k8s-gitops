---
# Idempotent: a re-run with a valid stored token changes nothing. Jobs are
# immutable, so the bot's Flux Kustomization sets force: true to replace
# this one when the template changes. The pod talks to Tuwunel on the
# cluster Service; MATRIX_HOMESERVER written for the bot is the public URL.
apiVersion: batch/v1
kind: Job
metadata:
  name: hermes-provision-${BOT_NAME}
  namespace: matrix
  labels:
    app.kubernetes.io/name: hermes-bot-provisioner
    app.kubernetes.io/instance: ${BOT_NAME}
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-bot-provisioner
        app.kubernetes.io/instance: ${BOT_NAME}
    spec:
      serviceAccountName: hermes-provision-${BOT_NAME}
      restartPolicy: OnFailure
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provision
          image: docker.io/library/python:3.15.2-alpine3.24@sha256:20a82dbc2783112ddb91d1534603f802d222a3e63e593cd002eb2ac534e70211
          command:
            - python3
            - /opt/provision/provision.py
          env:
            - name: BOT_NAME
              value: ${BOT_NAME}
            - name: BOT_NAMESPACE
              value: ${BOT_NAMESPACE}
            - name: SERVER_NAME
              value: ryanholt.net
            - name: HOMESERVER_URL
              value: http://tuwunel.matrix.svc.cluster.local:8008
            - name: PUBLIC_HOMESERVER_URL
              value: https://matrix.ryanholt.net
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: AS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tuwunel-appservice-hermes-bots
                  key: as_token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          volumeMounts:
            - name: script
              mountPath: /opt/provision
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: hermes-bot-provisioner
