---
# Empty on purpose. RBAC cannot limit create to one name (resourceNames
# does not apply to create), so Flux creates the object and the Job only
# gets get and patch on it. IfNotPresent: Flux creates it once and never
# reapplies it, so the Job's data stays. Pruning the bot's Kustomization
# deletes it.
apiVersion: v1
kind: Secret
metadata:
  name: hermes-${BOT_NAME}-matrix
  namespace: hermes-${BOT_NAME}
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
  labels:
    app.kubernetes.io/name: hermes-bot-provisioner
    app.kubernetes.io/instance: ${BOT_NAME}
type: Opaque
