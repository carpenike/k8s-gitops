---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Shared part of bot provisioning: the script and its network policy. No
# bot is wired yet. A bot is one more Flux Kustomization on ./template,
# shaped like kubernetes/examples/hermes-bot-matrix.yaml. See
# docs/matrix.md. No postBuild substitution here: the script is Python.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hermes-bot-provisioner
  namespace: flux-system
spec:
  dependsOn:
    - name: tuwunel
      namespace: flux-system
  interval: 1h
  path: ./kubernetes/apps/matrix/hermes-bot-provisioner/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: matrix
