---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# No namespace transformer. The Flux Kustomizations stay in flux-system so
# tuwunel can read the sops-age secret, the same shape as nut-system. Each
# one targets namespace matrix. See docs/apps/matrix.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./namespace.yaml
  - ./tuwunel/ks.yaml
  - ./hermes-bot-provisioner/ks.yaml
