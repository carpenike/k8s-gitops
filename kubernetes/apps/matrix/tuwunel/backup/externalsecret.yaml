---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Item volsync-restic in vault k8s-secrets, to be created. One item for
# every VolSync source: repository_base is the restic URL prefix (for
# example s3:https://<endpoint>/<bucket>), and each source appends its own
# path. The endpoint stays in 1Password, not in git. See
# docs/placeholders.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tuwunel-volsync
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: tuwunel-volsync
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        RESTIC_REPOSITORY: "{{ .repository_base }}/matrix/tuwunel"
        RESTIC_PASSWORD: "{{ .restic_password }}"
        AWS_ACCESS_KEY_ID: "{{ .aws_access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ .aws_secret_access_key }}"
  data:
    - secretKey: repository_base
      remoteRef:
        key: volsync-restic/repository_base
    - secretKey: restic_password
      remoteRef:
        key: volsync-restic/restic_password
    - secretKey: aws_access_key_id
      remoteRef:
        key: volsync-restic/aws_access_key_id
    - secretKey: aws_secret_access_key
      remoteRef:
        key: volsync-restic/aws_secret_access_key
