---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Item volsync-r2-template in vault k8s-secrets, the Cloudflare R2 restic
# item v1 used for every app (kubernetes/cluster-0/components/volsync/r2
# on main). Same fields, and the same <REPOSITORY_TEMPLATE>/<app> path
# convention. No v1 app was named tuwunel, so the path is new. R2 is
# offsite, which architecture.md asks of backups, and public, which the
# mover egress policy already allows.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tuwunel-volsync
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: tuwunel-volsync
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        RESTIC_REPOSITORY: "{{ .REPOSITORY_TEMPLATE }}/tuwunel"
        RESTIC_PASSWORD: "{{ .RESTIC_PASSWORD }}"
        AWS_ACCESS_KEY_ID: "{{ .AWS_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .AWS_SECRET_ACCESS_KEY }}"
  data:
    - secretKey: REPOSITORY_TEMPLATE
      remoteRef:
        key: volsync-r2-template/REPOSITORY_TEMPLATE
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: volsync-r2-template/RESTIC_PASSWORD
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: volsync-r2-template/AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: volsync-r2-template/AWS_SECRET_ACCESS_KEY
