# Appservice registration for Hermes bot accounts. hermes-bots.yaml is the
# only key Tuwunel mounts (appservice_dir). as_token is the same value as in
# that YAML, kept as its own key for the provisioning Job's secretKeyRef.
# Rotate both together. url is null: the appservice receives no transactions,
# it only registers and logs in the bot users.
#
# The users regex is an explicit list of bot names, not a pattern: the
# as_token can log in as anything it matches. Add a name with the YubiKey
# (sops this file) before provisioning that bot. See docs/matrix.md.
