# Static registration token for people (Ryan, family). Tuwunel reads it from
# registration_token_file. Bots do not use it; they register through the
# hermes-bots appservice. Decrypt with the YubiKey: sops -d this file.
# Rotate by writing a new file and encrypting it; sops only needs the public
# keys for that. registration_token_file is reloadable, and Reloader also
# restarts the pod on the Secret change.
