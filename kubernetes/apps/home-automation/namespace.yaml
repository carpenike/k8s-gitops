---
# Privileged, like scrypted: Home Assistant's init container needs NET_ADMIN
# to put the VLAN 30 connected route back after sbr, and Z-Wave JS UI opens
# the USB stick through a hostPath device, which needs a privileged
# container. Every other container drops all capabilities. ADR 0018.
apiVersion: v1
kind: Namespace
metadata:
  name: home-automation
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
