---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Item home-assistant-env in vault k8s-secrets: one field per variable in
# Forge's sops secret home-assistant/env, each field named exactly as the
# variable (SECRET_ZONE_HOME_LATITUDE, SECRET_NEEVO_AUTHORIZATION, ...), so
# `extract` hands them to the container unchanged and !env_var in hass-config
# keeps working. HA_POSTGRES_URL is not taken from that item: it is built
# below for postgres17.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-env
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: home-assistant-env
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: home-assistant-env
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The recorder URL (item home-assistant-recorder, the field postgres17's role
# reads), and the git-sync reload webhook: item home-assistant-gitops, field
# webhook_id, a random string. Home Assistant's gitops automation
# (hass-config packages/gitops.yaml) listens on that id, local only.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: home-assistant
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        HA_POSTGRES_URL: "postgresql://hass_recorder:{{ .db_password | urlquery }}@postgres17-rw.cnpg-system.svc.cluster.local:5432/home_assistant?sslmode=require"
        HA_GITOPS_WEBHOOK_ID: "{{ .webhook_id }}"
  data:
    - secretKey: db_password
      remoteRef:
        key: home-assistant-recorder/db_password
    - secretKey: webhook_id
      remoteRef:
        key: home-assistant-gitops/webhook_id
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The read-only deploy key on carpenike/hass-config (item home-assistant-gitops,
# field deploy_key: an ed25519 private key whose public half is the repo's
# deploy key with write access OFF). git-sync can pull and never push.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-deploy-key
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: home-assistant-deploy-key
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ssh: "{{ .deploy_key }}"
  data:
    - secretKey: deploy_key
      remoteRef:
        key: home-assistant-gitops/deploy_key
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The git-sync sidecar's only secret: the webhook URL it calls after a new
# commit. Its own Secret so the sidecar never sees the recorder password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-gitsync
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: home-assistant-gitsync
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        GITSYNC_WEBHOOK_URL: "http://127.0.0.1:8123/api/webhook/{{ .webhook_id }}"
  data:
    - secretKey: webhook_id
      remoteRef:
        key: home-assistant-gitops/webhook_id
