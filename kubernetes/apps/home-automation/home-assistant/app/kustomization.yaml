---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ocirepository.yaml
  - ./externalsecret.yaml
  - ./media.yaml
  - ./helmrelease.yaml
  - ./httproute.yaml
  - ./ciliumnetworkpolicy.yaml
configMapGenerator:
  - name: home-assistant-gitops
    files:
      - ./link-config.sh
      - ./known_hosts
generatorOptions:
  disableNameSuffixHash: true
