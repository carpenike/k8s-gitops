---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# In: the UI 8091 from envoy-internal; the unauthenticated WebSocket server
# 3002 from Home Assistant only. Out: DNS and the broker. Device-database
# and firmware update lookups are not allowed; open them here for an update.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: zwave-js-ui
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: zwave-js-ui
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      toPorts:
        - ports:
            - port: "8091"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: home-assistant
      toPorts:
        - ports:
            - port: "3002"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: emqx
      toPorts:
        - ports:
            - port: "1883"
              protocol: TCP
