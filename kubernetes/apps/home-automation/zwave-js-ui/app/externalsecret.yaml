---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Item zwave-js-ui in vault k8s-secrets: the session secret and the six
# Z-Wave security keys, copied from Forge's sops file (zwave-js-ui/*) at
# cutover, never printed. A lost or changed key means re-including every
# secure node, so the values must be Forge's. Z-Wave JS UI reads the KEY_*
# variables at start and they override settings.json. The broker password
# is item emqx, field zwave_js_ui_password; it is entered once in the UI's
# MQTT settings at cutover (settings.json, on the volume).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zwave-js-ui
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: zwave-js-ui
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SESSION_SECRET: "{{ .session_secret }}"
        KEY_S0_Legacy: "{{ .s0_legacy_key }}"
        KEY_S2_Unauthenticated: "{{ .s2_unauthenticated_key }}"
        KEY_S2_Authenticated: "{{ .s2_authenticated_key }}"
        KEY_S2_AccessControl: "{{ .s2_access_control_key }}"
        KEY_LR_S2_Authenticated: "{{ .s2_long_range_key }}"
        KEY_LR_S2_AccessControl: "{{ .s2_long_range_access_control_key }}"
  data:
    - secretKey: session_secret
      remoteRef:
        key: zwave-js-ui/session_secret
    - secretKey: s0_legacy_key
      remoteRef:
        key: zwave-js-ui/s0_legacy_key
    - secretKey: s2_unauthenticated_key
      remoteRef:
        key: zwave-js-ui/s2_unauthenticated_key
    - secretKey: s2_authenticated_key
      remoteRef:
        key: zwave-js-ui/s2_authenticated_key
    - secretKey: s2_access_control_key
      remoteRef:
        key: zwave-js-ui/s2_access_control_key
    - secretKey: s2_long_range_key
      remoteRef:
        key: zwave-js-ui/s2_long_range_key
    - secretKey: s2_long_range_access_control_key
      remoteRef:
        key: zwave-js-ui/s2_long_range_access_control_key
