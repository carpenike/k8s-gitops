---
# The EMQX dashboard has its own login (the admin account, with TOTP turned
# on after the first login), so the route opts out of the gateway Pocket ID
# login (label app, envoy-internal only). docs/platform/gateway-auth.md.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: emqx
  labels:
    gateway.holthome.net/auth: app
spec:
  hostnames:
    - emqx.${SECRET_DOMAIN}
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - name: emqx
          port: 18083
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: emqx-gateway-auth
spec:
  from:
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: network
  to:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: emqx
