---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Item emqx in vault k8s-secrets. One field per MQTT user, copied from
# Forge's sops file at cutover (docs/apps/home-automation.md), plus the
# dashboard admin password. The users file is EMQX's bootstrap file for the
# built-in database: EMQX imports it into its own store on start, so a
# password changed here also needs the dashboard or the API to take effect
# on a broker that already has the user.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: emqx
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: emqx
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        EMQX_DASHBOARD__DEFAULT_PASSWORD: "{{ .dashboard_password }}"
        users.csv: |
          user_id,password,is_superuser
          home-assistant,{{ .home_assistant_password }},false
          zigbee2mqtt,{{ .zigbee2mqtt_password }},false
          zwave-js-ui,{{ .zwave_js_ui_password }},false
          frigate,{{ .frigate_password }},false
          teslamate,{{ .teslamate_password }},false
          scrypted,{{ .scrypted_password }},false
  data:
    - secretKey: dashboard_password
      remoteRef:
        key: emqx/dashboard_password
    - secretKey: home_assistant_password
      remoteRef:
        key: emqx/home_assistant_password
    - secretKey: zigbee2mqtt_password
      remoteRef:
        key: emqx/zigbee2mqtt_password
    - secretKey: zwave_js_ui_password
      remoteRef:
        key: emqx/zwave_js_ui_password
    - secretKey: frigate_password
      remoteRef:
        key: emqx/frigate_password
    - secretKey: teslamate_password
      remoteRef:
        key: emqx/teslamate_password
    - secretKey: scrypted_password
      remoteRef:
        key: emqx/scrypted_password
