%% Topic ACLs, file source. Same users and topics as Forge's EMQX
%% integrations (carpenike/nix-config modules/nixos/services/*/default.nix),
%% plus the bridge topics Home Assistant reads and writes.
%%
%% no_match is allow, as on Forge, so this file documents intent and a
%% missing rule cannot break a client at cutover. Switching no_match to deny
%% is a follow-up once the broker's authorization metrics show no misses
%% (docs/apps/home-automation.md).
{allow, {user, "home-assistant"}, all, ["homeassistant/#", "hass/#", "zigbee2mqtt/#", "zwave/#", "frigate/#", "teslamate/#", "scrypted/#"]}.
{allow, {user, "zigbee2mqtt"}, all, ["zigbee2mqtt/#", "homeassistant/#"]}.
{allow, {user, "zwave-js-ui"}, all, ["zwave/#", "homeassistant/#"]}.
{allow, {user, "frigate"}, all, ["frigate/#", "homeassistant/#"]}.
{allow, {user, "teslamate"}, all, ["teslamate/#"]}.
{allow, {user, "scrypted"}, all, ["scrypted/#", "homeassistant/#"]}.
{deny, all, subscribe, ["$SYS/#", {eq, "#"}]}.
