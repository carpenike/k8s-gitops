---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The broker password for user zigbee2mqtt (item emqx, the same field the
# broker's bootstrap file reads) and the Zigbee PAN ids (item zigbee2mqtt).
# Forge passes the PAN ids only as environment variables, so they are not in
# the data directory copied at cutover; without them zigbee2mqtt would not
# match the coordinator's network. The network key is in the copied
# secret.yaml, which the copied configuration.yaml references.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zigbee2mqtt
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: zigbee2mqtt
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ZIGBEE2MQTT_CONFIG_MQTT_PASSWORD: "{{ .password }}"
        ZIGBEE2MQTT_CONFIG_ADVANCED_PAN_ID: "{{ .pan_id }}"
        ZIGBEE2MQTT_CONFIG_ADVANCED_EXT_PAN_ID: "{{ .ext_pan_id }}"
  data:
    - secretKey: password
      remoteRef:
        key: emqx/zigbee2mqtt_password
    - secretKey: pan_id
      remoteRef:
        key: zigbee2mqtt/pan_id
    - secretKey: ext_pan_id
      remoteRef:
        key: zigbee2mqtt/ext_pan_id
