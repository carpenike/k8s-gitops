---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The broker password for user zigbee2mqtt (item emqx, the same field the
# broker's bootstrap file reads). The Zigbee network key and PAN id stay in
# the data directory's configuration.yaml, copied from Forge at cutover.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zigbee2mqtt
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: zigbee2mqtt
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ZIGBEE2MQTT_CONFIG_MQTT_PASSWORD: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: emqx/zigbee2mqtt_password
