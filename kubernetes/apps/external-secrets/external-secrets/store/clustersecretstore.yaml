---
# The service-account token secret is created out of band. See bootstrap/README.md.
#
# 1Password rate-limits service accounts (docs/platform/external-secrets.md, "1Password
# rate limits"). Every ExternalSecret field is one Resolve call per refresh, so
# ExternalSecrets here refresh every 12h, and a rotation is pushed at once with
# the force-sync annotation.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword
spec:
  provider:
    onepasswordSDK:
      # Vault name k8s-secrets, the vault v1 selected in the Connect store.
      vault: h3aojtbptukuxixo5ysdco7r6u
      auth:
        serviceAccountSecretRef:
          name: onepassword-sdk
          namespace: external-secrets
          key: token
      # In-memory cache of resolved fields (ESO marks it experimental). It
      # serves repeat reads of one field within 10 minutes from memory: the
      # R2 template fields three ExternalSecrets read, a bot's
      # hindsight_api_key read twice, and the burst after a controller
      # restart. A 12h refresh never hits it. A value rotated in 1Password
      # reaches a force-synced ExternalSecret up to 10 minutes late if that
      # field was read in the last 10 minutes.
      cache:
        ttl: 10m
        maxSize: 100
