---
# The service-account token secret is created out of band. See bootstrap/README.md.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword
spec:
  provider:
    onepasswordSDK:
      vault: PLACEHOLDER_VAULT_ID
      auth:
        serviceAccountSecretRef:
          name: onepassword-sdk
          namespace: external-secrets
          key: token
