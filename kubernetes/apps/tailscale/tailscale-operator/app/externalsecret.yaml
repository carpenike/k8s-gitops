---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The chart's Deployment mounts Secret operator-oauth (its fullname is
# "operator") at /oauth and reads client_id and client_secret. The OAuth
# client is created in the Tailscale admin console; see docs/tailscale.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: operator-oauth
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: tailscale/client_id
    - secretKey: client_secret
      remoteRef:
        key: tailscale/client_secret
