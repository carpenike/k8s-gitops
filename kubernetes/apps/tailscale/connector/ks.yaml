---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Separate from the operator so the Connector applies after the chart has
# installed the tailscale.com CRDs.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale-connector
spec:
  dependsOn:
    - name: tailscale-operator
      namespace: tailscale
  interval: 1h
  path: ./kubernetes/apps/tailscale/connector/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: tailscale
