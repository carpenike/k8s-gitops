---
# The HTTPRoute itself is in the HelmRelease (route.app). Grafana signs
# people in with its own Pocket ID client, so the route is labelled native
# and the gateway login is skipped: one login per route
# (docs/platform/gateway-auth.md). This grant lets pocket-id-exempt in namespace
# network select it.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: grafana-gateway-auth
spec:
  from:
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: network
  to:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: grafana
