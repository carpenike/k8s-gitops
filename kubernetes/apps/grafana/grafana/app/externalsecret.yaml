---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Item grafana-forge in vault k8s-secrets. Field names are Forge's sops keys
# (grafana/admin-password, grafana/oidc_client_secret), and the values must
# be Forge's: the admin password only seeds a NEW grafana.db, so after the
# copy the stored admin password is Forge's, and the plugin setup Job and
# OnCall log in with this value. The OIDC secret is Pocket ID client
# grafana's, which keeps its callback host.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: grafana-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        GF_SECURITY_ADMIN_PASSWORD: "{{ .admin_password }}"
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "{{ .oidc_client_secret }}"
  data:
    - secretKey: admin_password
      remoteRef:
        key: grafana-forge/admin-password
    - secretKey: oidc_client_secret
      remoteRef:
        key: grafana-forge/oidc_client_secret
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Datasource provisioning, rendered here because two entries carry
# passwords (postgres17 items from docs/postgres17.md). Mounted at
# /etc/grafana/provisioning/datasources. UIDs and names are Forge's
# (modules/nixos/services/grafana autoConfigure, and the grafanaDatasources
# in hosts/forge/services/schoolhouse.nix and homelab-mcp.nix), so every
# dashboard and the rows in the copied grafana.db resolve unchanged.
# Passwords go through toJson so any character survives as a YAML string.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-datasources
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: grafana-datasources
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        datasources.yaml: |
          apiVersion: 1
          datasources:
            # Forge's Prometheus, through its Caddy vhost. The sleds may
            # read the query API without the Pocket ID login (nix-config
            # cutover, docs/grafana.md), GET only, so httpMethod is GET.
            - name: Prometheus
              uid: auto-prometheus-auto
              type: prometheus
              access: proxy
              orgId: 1
              url: https://prom.${SECRET_DOMAIN}
              isDefault: true
              jsonData:
                httpMethod: GET
            # Forge's Loki, through its Caddy vhost, same bypass. Forge's
            # timeout and line limit for large log queries.
            - name: Loki
              uid: auto-loki-auto
              type: loki
              access: proxy
              orgId: 1
              url: https://loki.${SECRET_DOMAIN}
              isDefault: false
              jsonData:
                timeout: 120
                maxLines: 5000
            # This cluster's Prometheus (kube-prometheus-stack). New; no
            # Forge dashboard uses it.
            - name: Prometheus (k8s)
              uid: k8s-prometheus
              type: prometheus
              access: proxy
              orgId: 1
              url: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
              isDefault: false
              jsonData:
                httpMethod: POST
            - name: Schoolhouse
              uid: schoolhouse
              type: grafana-postgresql-datasource
              access: proxy
              orgId: 1
              url: postgres17-rw.cnpg-system.svc.cluster.local:5432
              database: schoolhouse
              user: schoolhouse_grafana
              isDefault: false
              jsonData:
                database: schoolhouse
                sslmode: require
                timescaledb: false
                postgresVersion: 1700
                maxOpenConns: 5
                maxIdleConns: 2
                connMaxLifetime: 14400
              secureJsonData:
                password: {{ .schoolhouse_password | toJson }}
            - name: Household Finance
              uid: household-finance
              type: grafana-postgresql-datasource
              access: proxy
              orgId: 1
              url: postgres17-rw.cnpg-system.svc.cluster.local:5432
              database: homelab_finance
              user: homelab_finance_grafana
              isDefault: false
              jsonData:
                database: homelab_finance
                sslmode: require
                timescaledb: false
                postgresVersion: 1700
                maxOpenConns: 5
                maxIdleConns: 2
                connMaxLifetime: 14400
              secureJsonData:
                password: {{ .finance_password | toJson }}
  data:
    - secretKey: schoolhouse_password
      remoteRef:
        key: schoolhouse/grafana_password
    - secretKey: finance_password
      remoteRef:
        key: homelab-finance/grafana_db_password
