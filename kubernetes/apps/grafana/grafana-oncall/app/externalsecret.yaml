---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Forge's sops template grafana-oncall-env, from item grafana-oncall (fields
# named after the sops keys grafana-oncall/secret_key and
# grafana-oncall/metrics_secret) plus the Grafana admin password from item
# grafana. secret_key must be Forge's value: OnCall encrypts integration and
# notification credentials in the database with it, and the database is
# copied. grafana-oncall/alertmanager-webhook-url stays on Forge (its
# Alertmanager reads it) and has no field here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oncall
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: grafana-oncall-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SECRET_KEY: "{{ .secret_key }}"
        MIRAGE_SECRET_KEY: "{{ .secret_key }}"
        # Also the bearer token the ServiceMonitor sends to /metrics/.
        PROMETHEUS_EXPORTER_SECRET: "{{ .metrics_secret }}"
        GRAFANA_ADMIN_PASSWORD: "{{ .grafana_admin_password }}"
  data:
    - secretKey: secret_key
      remoteRef:
        key: grafana-oncall/secret_key
    - secretKey: metrics_secret
      remoteRef:
        key: grafana-oncall/metrics_secret
    - secretKey: grafana_admin_password
      remoteRef:
        key: grafana/admin-password
