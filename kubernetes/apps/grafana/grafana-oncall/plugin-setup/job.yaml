---
# Forge's grafana-oncall-plugin-setup, as a Job (setup-plugin.py says what it
# does). Idempotent. Jobs are immutable, so Kustomization
# grafana-oncall-plugin-setup sets force: true to replace it when this file
# or the script changes. No TTL: a deleted Job would be recreated and run
# again on every reconcile.
apiVersion: batch/v1
kind: Job
metadata:
  name: grafana-oncall-plugin-setup
  labels:
    app.kubernetes.io/name: grafana-oncall-plugin-setup
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-oncall-plugin-setup
    spec:
      # Never, so each failed attempt keeps its pod and logs.
      restartPolicy: Never
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: setup
          # The pinned Python image the other provisioning Jobs use.
          image: docker.io/library/python:3.15.2-slim-trixie@sha256:e97b88e416c3c01eb427b21fd8cd3ebf006e6ee38afcfcc3cae1c54ee2ab0a75
          command:
            - python3
            - /opt/setup/setup-plugin.py
          env:
            - name: GRAFANA_URL
              value: http://grafana.grafana.svc.cluster.local:3000
            # Written into the plugin's settings: the plugin backend in the
            # Grafana pod calls the engine here, and the engine stores the
            # Grafana URL from install and calls back on it.
            - name: ONCALL_API_URL
              value: http://grafana-oncall-engine.grafana.svc.cluster.local:8080
            - name: GRAFANA_URL_FOR_ONCALL
              value: http://grafana.grafana.svc.cluster.local:3000
            - name: GRAFANA_ADMIN_USER
              value: admin
            - name: GRAFANA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-secret
                  key: GF_SECURITY_ADMIN_PASSWORD
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          volumeMounts:
            - name: script
              mountPath: /opt/setup
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: grafana-oncall-plugin-setup
