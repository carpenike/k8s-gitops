---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: volsync
spec:
  chartRef:
    kind: OCIRepository
    name: volsync
  interval: 1h
  values:
    replicaCount: 2
    manageCRDs: true
    # The chart's ServiceMonitor scrapes /metrics over HTTPS with no bearer
    # token, so the controller's authn/authz filter answers 401. Turning the
    # check off lets Prometheus scrape. The metrics are controller and
    # replication counters, reachable only inside the cluster.
    metrics:
      disableAuth: true
