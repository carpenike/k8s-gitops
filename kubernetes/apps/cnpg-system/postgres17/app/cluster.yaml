---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
# Shared PostgreSQL 17. Forge's LiteLLM database is PostgreSQL 17, so a
# custom-format dump from that server restores into this image.
# The bootstrap database is `app`. LiteLLM uses the Database below.
# Two backups: volume snapshots (csi-ceph-block, stay on Ceph) and Barman
# Cloud to R2 (ObjectStore postgres17-r2: continuous WAL plus a daily base
# backup, 30 days). waitForArchive stays false so a snapshot never waits on
# R2. docs/postgres17.md.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres17
spec:
  instances: 2
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:17.9
  storage:
    storageClass: ceph-block
    size: 20Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  bootstrap:
    initdb:
      database: app
      owner: app
  # The plugin's sidecar archives every WAL segment to R2. Adding or
  # removing this restarts the instances: the standby first, then the
  # primary in place (primaryUpdateMethod restart, no switchover), so
  # clients lose the database for a few minutes.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres17-r2
  backup:
    volumeSnapshot:
      className: csi-ceph-block
      online: true
      onlineConfiguration:
        waitForArchive: false
  managed:
    roles:
      - name: litellm
        ensure: present
        login: true
        comment: LiteLLM proxy
        passwordSecret:
          name: litellm-db
      - name: hindsight
        ensure: present
        login: true
        comment: Hindsight memory server (hermes-memory)
        passwordSecret:
          name: hindsight-db
      - name: openproject
        ensure: present
        login: true
        comment: OpenProject task board (openproject)
        passwordSecret:
          name: openproject-db
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: litellm
spec:
  cluster:
    name: postgres17
  name: litellm
  owner: litellm
  databaseReclaimPolicy: retain
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/database_v1.json
# Hindsight (namespace hermes-memory, docs/hermes-memory.md): one schema per
# bot (user_<bot>), created by the server. The operator installs the
# extensions as superuser, in public, where Hindsight looks for them
# (hindsight_api/_pg_extensions.py at v1.2.0): vector for embeddings, pg_trgm
# and btree_gin for entity resolution. Without the last two Hindsight falls
# back to slower full scans; the hindsight role could not create them itself.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: hindsight
spec:
  cluster:
    name: postgres17
  name: hindsight
  owner: hindsight
  databaseReclaimPolicy: retain
  extensions:
    - name: vector
      ensure: present
    - name: pg_trgm
      ensure: present
    - name: btree_gin
      ensure: present
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/database_v1.json
# OpenProject (namespace openproject, docs/openproject.md). Its extensions go
# in pg_catalog, not public: the image's SQL structure load clears
# search_path and names operator classes such as gin_trgm_ops without a
# schema, so with them in public the first schema load fails (learned on
# Forge, nix-config docs/services/openproject.md).
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: openproject
spec:
  cluster:
    name: postgres17
  name: openproject
  owner: openproject
  databaseReclaimPolicy: retain
  extensions:
    - name: btree_gist
      ensure: present
      schema: pg_catalog
    - name: pg_trgm
      ensure: present
      schema: pg_catalog
    - name: unaccent
      ensure: present
      schema: pg_catalog
