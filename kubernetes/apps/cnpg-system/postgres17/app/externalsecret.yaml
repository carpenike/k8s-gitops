---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Item litellm in vault k8s-secrets. Field database_password is the role
# password. The username is the CNPG role name, not a 1Password field.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: litellm-db
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: litellm
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: litellm/database_password
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Item hindsight in vault k8s-secrets, field database_password: the role
# password, raw. hermes-memory reads the same field (URL-encoded for the
# server's connection URL, raw for the backup job).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hindsight-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: hindsight-db
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: hindsight
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: hindsight/database_password
