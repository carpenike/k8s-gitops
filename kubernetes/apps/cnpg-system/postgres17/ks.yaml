---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: postgres17
spec:
  dependsOn:
    - name: cloudnative-pg
      namespace: cnpg-system
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: external-secrets
      namespace: external-secrets
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: litellm-db
      namespace: cnpg-system
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: postgres17
      namespace: cnpg-system
    - apiVersion: postgresql.cnpg.io/v1
      kind: Database
      name: litellm
      namespace: cnpg-system
  # Database status is status.applied, not a Ready condition.
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Database
      current: has(status.applied) && status.applied == true
  interval: 1h
  path: ./kubernetes/apps/cnpg-system/postgres17/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: cnpg-system
