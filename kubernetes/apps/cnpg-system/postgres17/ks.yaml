---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# The Cluster, its databases, and the R2 ObjectStore. ObjectStore
# postgres17-r2 takes its endpoint and bucket from Secret postgres17-r2-vars,
# which Kustomization postgres17-r2 below makes from 1Password. Until that
# item exists this Kustomization waits and changes nothing: the running
# Cluster stays as it was. docs/postgres17.md.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: postgres17
spec:
  dependsOn:
    - name: cloudnative-pg
      namespace: cnpg-system
    - name: barman-cloud
      namespace: cnpg-system
    - name: postgres17-r2
      namespace: cnpg-system
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: external-secrets
      namespace: external-secrets
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: litellm-db
      namespace: cnpg-system
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: postgres17
      namespace: cnpg-system
    - apiVersion: postgresql.cnpg.io/v1
      kind: Database
      name: litellm
      namespace: cnpg-system
  # Database status is status.applied, not a Ready condition.
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Database
      current: has(status.applied) && status.applied == true
  interval: 1h
  path: ./kubernetes/apps/cnpg-system/postgres17/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
      - name: postgres17-r2-vars
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: cnpg-system
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# R2 credentials and endpoint for postgres17's Barman Cloud backup, from
# 1Password item postgres17-r2. A Kustomization of its own because
# postgres17 substitutes from one of these Secrets, which must exist before
# postgres17 is built.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: postgres17-r2
spec:
  dependsOn:
    - name: external-secrets
      namespace: external-secrets
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: postgres17-r2
      namespace: cnpg-system
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: postgres17-r2-vars
      namespace: cnpg-system
  interval: 1h
  path: ./kubernetes/apps/cnpg-system/postgres17/r2
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: cnpg-system
