---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Item postgres17-r2 in vault k8s-secrets: an R2 API token (Object Read &
# Write, scoped to the bucket) for Barman Cloud. Same Cloudflare account as
# volsync-r2-template. Keys are the ones ObjectStore postgres17-r2 reads.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres17-r2
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: postgres17-r2
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ACCESS_KEY_ID: "{{ .access_key_id }}"
        ACCESS_SECRET_KEY: "{{ .secret_access_key }}"
  data:
    - secretKey: access_key_id
      remoteRef:
        key: postgres17-r2/access_key_id
    - secretKey: secret_access_key
      remoteRef:
        key: postgres17-r2/secret_access_key
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Same item. The R2 endpoint (it carries the account id) and the bucket name
# are site-specific, so they stay out of git. Kustomization postgres17 reads
# this Secret through postBuild.substituteFrom: ${CNPG_R2_ENDPOINT} and
# ${CNPG_R2_BUCKET} in ObjectStore postgres17-r2. No credentials here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres17-r2-vars
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: postgres17-r2-vars
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        CNPG_R2_ENDPOINT: "{{ .endpoint_url }}"
        CNPG_R2_BUCKET: "{{ .bucket }}"
  data:
    - secretKey: endpoint_url
      remoteRef:
        key: postgres17-r2/endpoint_url
    - secretKey: bucket
      remoteRef:
        key: postgres17-r2/bucket
