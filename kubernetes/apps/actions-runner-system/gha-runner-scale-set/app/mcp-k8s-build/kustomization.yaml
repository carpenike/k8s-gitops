# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# Second repo-scoped scale set for carpenike/mcp: the jobs mcp-k8s cannot run.
# Workflows opt in with runs-on: mcp-k8s-build. Used by the Nix job (a Nix
# install with build sandboxing) and the image job (docker build + push).
#
# Every runner pod is a Kata VM (runtimeClassName kata-qemu, ADR 0009). The
# runner container and the dind sidecar are privileged, but the kata-qemu
# handler sets privileged_without_host_devices = true, so "privileged" means
# privileged inside the guest: no host devices, no host kernel. That is the
# boundary ADR 0011 records. No /dev/kvm reaches the guest, so a job that
# needs KVM (a NixOS VM test) does not run here.
#
# Ordinary mcp jobs stay on mcp-k8s (runc, unprivileged).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../scale-set
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: scale-set
    patch: |-
      - op: replace
        path: /metadata/name
        value: mcp-k8s-build
      - op: replace
        path: /spec/values/githubConfigUrl
        value: https://github.com/carpenike/mcp
      - op: replace
        path: /spec/values/runnerScaleSetName
        value: mcp-k8s-build
      - op: replace
        path: /spec/values/maxRunners
        value: 2
      - op: add
        path: /spec/values/template/spec/runtimeClassName
        value: kata-qemu
      # Nix's build sandbox needs mount and user namespaces, and the Nix
      # installer runs as root. Privileged inside the Kata guest only.
      - op: add
        path: /spec/values/template/spec/containers/0/securityContext
        value:
          privileged: true
      - op: add
        path: /spec/values/template/spec/containers/0/volumeMounts/-
        value:
          name: nix-store
          mountPath: /nix
      - op: add
        path: /spec/values/template/spec/volumes/-
        value:
          name: nix-store
          emptyDir:
            sizeLimit: 40Gi
      # Kubelet creates emptyDir directories mode 0777, and Nix refuses a
      # world-writable /nix ("Path "/nix" is world-writable or a symlink").
      # The runner user has passwordless sudo in the actions-runner image.
      - op: replace
        path: /spec/values/template/spec/containers/0/command
        value:
          - /bin/bash
          - -c
          - sudo chmod 0755 /nix && chmod 0755 /home/runner && exec /home/runner/run.sh
      # Docker's storage. In a Kata guest the container rootfs is virtio-fs,
      # which overlayfs cannot use as an upper layer, so image builds fail
      # with "failed to mount ... fstype: overlay ... err: invalid argument".
      # A Memory emptyDir is a tmpfs inside the guest, which overlayfs
      # accepts. The dind sidecar mounts it at /var/lib/docker (post-renderer
      # below). See kata-containers docs/how-to/how-to-run-docker-with-kata.md.
      - op: add
        path: /spec/values/template/spec/volumes/-
        value:
          name: dind-storage
          emptyDir:
            medium: Memory
            sizeLimit: 12Gi
      - op: replace
        path: /spec/values/template/spec/containers/0/resources/requests/cpu
        value: "2"
      - op: replace
        path: /spec/values/template/spec/containers/0/resources/requests/memory
        value: 4Gi
      - op: replace
        path: /spec/values/template/spec/containers/0/resources/limits/cpu
        value: "8"
      - op: replace
        path: /spec/values/template/spec/containers/0/resources/limits/memory
        value: 16Gi
      # The chart gives the dind sidecar an exec startup probe (docker info)
      # and has no value to turn it off. Under Kata the probe can never run:
      # the docker:dind entrypoint moves its processes into a child cgroup and
      # enables controllers on the container's cgroup, and kata-agent then
      # cannot add the exec process to it ("unable to write to a control group
      # file cgroup.procs ... Resource busy"). The probe result stays unknown,
      # the sidecar never counts as started, and the runner container never
      # starts. The runner waits for docker itself
      # (RUNNER_WAIT_FOR_DOCKER_IN_SECONDS=120, set by the chart), so the
      # probe is dropped here. It stays in place for the runc scale sets.
      #
      # The same patch mounts dind-storage at /var/lib/docker and gives the
      # sidecar a memory limit. Kata sizes the guest VM from container limits,
      # and the tmpfs, dockerd and the build containers it runs are all
      # charged to the sidecar, so the limit covers the 12Gi tmpfs plus
      # headroom for the builds.
      - op: add
        path: /spec/postRenderers
        value:
          - kustomize:
              patches:
                - target:
                    group: actions.github.com
                    version: v1alpha1
                    kind: AutoscalingRunnerSet
                  patch: |-
                    - op: test
                      path: /spec/template/spec/initContainers/1/name
                      value: dind
                    - op: remove
                      path: /spec/template/spec/initContainers/1/startupProbe
                    - op: add
                      path: /spec/template/spec/initContainers/1/volumeMounts/-
                      value:
                        name: dind-storage
                        mountPath: /var/lib/docker
                    - op: add
                      path: /spec/template/spec/initContainers/1/resources
                      value:
                        requests:
                          cpu: 500m
                          memory: 1Gi
                        limits:
                          cpu: "4"
                          memory: 16Gi
