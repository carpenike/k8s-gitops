# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Shared scale-set values. Each overlay sets metadata.name, githubConfigUrl,
# and runnerScaleSetName. Runners are ephemeral: one job, then the pod is
# removed. containerMode dind adds a privileged docker:dind sidecar.
# See docs/platform/actions-runners.md.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: scale-set
spec:
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set
  interval: 1h
  values:
    githubConfigUrl: https://github.com/carpenike/REPLACE
    githubConfigSecret: actions-runner-controller
    runnerScaleSetName: replace
    minRunners: 0
    maxRunners: 3
    containerMode:
      type: dind
    controllerServiceAccount:
      namespace: actions-runner-system
      name: gha-rs-controller
    listenerTemplate:
      spec:
        containers:
          - name: listener
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 256Mi
    # The tool cache sits where GitHub-hosted runners keep it. setup-python's
    # interpreters carry a RUNPATH of /opt/hostedtoolcache/..., so anywhere
    # else they load libpython only through LD_LIBRARY_PATH, and a subprocess
    # started with a minimal environment exits 127. Overlays append to env
    # with /env/-, never replace it.
    # The image ships /home/runner as mode 777. Code that checks the owner and
    # mode of every ancestor of a private directory under the workspace rejects
    # that, so the runner makes its home 755 before it starts.
    template:
      spec:
        containers:
          - name: runner
            image: ghcr.io/actions/actions-runner:2.338.2
            command: ["/bin/bash", "-c", "chmod 0755 /home/runner && exec /home/runner/run.sh"]
            env:
              - name: RUNNER_TOOL_CACHE
                value: /opt/hostedtoolcache
            volumeMounts:
              - name: tool-cache
                mountPath: /opt/hostedtoolcache
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                cpu: "2"
                memory: 4Gi
        volumes:
          - name: tool-cache
            emptyDir: {}
