# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# Repo-scoped scale set for carpenike/schoolhouse.
# Same GitHub App installation as sam-tracker. Workflows opt in with
# runs-on: schoolhouse-k8s. No Docker use, so this overlay drops dind and the runner
# pod is not privileged.
# uv with ruff, mypy, and pytest on a small suite.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../scale-set
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: scale-set
    patch: |-
      - op: replace
        path: /metadata/name
        value: schoolhouse-k8s
      - op: replace
        path: /spec/values/githubConfigUrl
        value: https://github.com/carpenike/schoolhouse
      - op: replace
        path: /spec/values/runnerScaleSetName
        value: schoolhouse-k8s
      - op: remove
        path: /spec/values/containerMode
