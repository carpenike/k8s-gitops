# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Item actions-runner-controller in vault k8s-secrets. Both scale sets
# read this Secret by name. The chart does not create it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: actions-runner-controller
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: actions-runner-controller
    creationPolicy: Owner
  data:
    - secretKey: github_app_id
      remoteRef:
        key: actions-runner-controller/github_app_id
    - secretKey: github_app_installation_id
      remoteRef:
        key: actions-runner-controller/github_app_installation_id
    - secretKey: github_app_private_key
      remoteRef:
        key: actions-runner-controller/github_app_private_key
