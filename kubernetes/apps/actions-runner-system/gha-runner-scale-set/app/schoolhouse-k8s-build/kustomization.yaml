# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# Image runners for carpenike/schoolhouse: the container image build that the
# k8s deployment pulls. Workflows opt in with runs-on: schoolhouse-k8s-build.
# Kata VM pods from ../build (ADR 0011). Lint and tests stay on
# schoolhouse-k8s.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../scale-set
  - ../build
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: scale-set
    patch: |-
      - op: replace
        path: /metadata/name
        value: schoolhouse-k8s-build
      - op: replace
        path: /spec/values/githubConfigUrl
        value: https://github.com/carpenike/schoolhouse
      - op: replace
        path: /spec/values/runnerScaleSetName
        value: schoolhouse-k8s-build
      - op: replace
        path: /spec/values/maxRunners
        value: 2
