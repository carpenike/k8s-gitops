# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# Repo-scoped scale set for carpenike/hass-config.
# Same GitHub App installation as sam-tracker. Workflows opt in with
# runs-on: hass-config-k8s. No Docker use, so this overlay drops dind and the runner
# pod is not privileged.
# Validation only: Home Assistant's check_config with placeholder values.
# The job gets no Home Assistant secret, and runner-egress refuses the LAN.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../scale-set
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: scale-set
    patch: |-
      - op: replace
        path: /metadata/name
        value: hass-config-k8s
      - op: replace
        path: /spec/values/githubConfigUrl
        value: https://github.com/carpenike/hass-config
      - op: replace
        path: /spec/values/runnerScaleSetName
        value: hass-config-k8s
      - op: remove
        path: /spec/values/containerMode
      - op: replace
        path: /spec/values/template/spec/containers/0/resources/requests/cpu
        value: 500m
      - op: replace
        path: /spec/values/template/spec/containers/0/resources/requests/memory
        value: 1Gi
      - op: replace
        path: /spec/values/template/spec/containers/0/resources/limits/cpu
        value: "2"
      - op: replace
        path: /spec/values/template/spec/containers/0/resources/limits/memory
        value: 4Gi
