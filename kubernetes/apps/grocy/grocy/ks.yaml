---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grocy
spec:
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: envoy-gateway
      namespace: network
    - name: external-secrets
      namespace: external-secrets
    - name: prometheus-operator-crds
      namespace: observability
  # No HelmRelease health check: until Forge's database is copied in, the pod
  # waits in its init container on purpose (docs/apps/grocy.md, "Cutover"),
  # and a health check would hold this Kustomization unready the whole time.
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: grocy-oidc
      namespace: grocy
  interval: 1h
  path: ./kubernetes/apps/grocy/grocy/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: grocy
  timeout: 10m
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Nothing depends on this. If 1Password item volsync-r2-template cannot be
# read, this Kustomization stays unready and Grocy does not wait on it.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grocy-backup
spec:
  dependsOn:
    - name: grocy
    - name: volsync
      namespace: volsync-system
    - name: external-secrets
      namespace: external-secrets
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: grocy-volsync
      namespace: grocy
  interval: 1h
  path: ./kubernetes/apps/grocy/grocy/backup
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: grocy
  timeout: 5m
