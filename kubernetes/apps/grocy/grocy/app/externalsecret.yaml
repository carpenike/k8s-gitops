---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The gateway's own Pocket ID client (item pocket-id-gateway, the same fields
# network/pocket-id-gateway reads), copied into this namespace for
# SecurityPolicy grocy in httproute.yaml. Envoy Gateway reads keys client-id
# and client-secret from a Secret in the policy's namespace. No new
# 1Password item. See docs/apps/grocy.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grocy-oidc
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: grocy-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: pocket-id-gateway/client_id
    - secretKey: client-secret
      remoteRef:
        key: pocket-id-gateway/client_secret
