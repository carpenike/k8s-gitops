---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  interval: 1h
  # CRDs belong to prometheus-operator-crds. This release must not install
  # or replace them.
  install:
    crds: Skip
  upgrade:
    crds: Skip
  values:
    crds:
      enabled: false
    alertmanager:
      enabled: false
    grafana:
      enabled: false
    prometheus:
      prometheusSpec:
        externalLabels:
          cluster: k8s-holthome
        retention: 7d
        replicas: 2
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-block
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 50Gi
        # Forge Alertmanager is http://127.0.0.1:9093. Caddy publishes it as
        # https://am.holthome.net (A 10.20.0.30). Pocket ID still gates that
        # vhost; see docs/architecture.md.
        additionalAlertManagerConfigs:
          - scheme: https
            api_version: v2
            static_configs:
              - targets:
                  - am.holthome.net:443
