---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-operator-crds
spec:
  chartRef:
    kind: OCIRepository
    name: prometheus-operator-crds
  interval: 1h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  # Chart defaults install every monitoring.coreos.com CRD. Operator v0.94.2,
  # the same release kube-prometheus-stack 92.14.0 ships.
  values: {}
