---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Shared part of the bots' OpenProject provisioning: the script, which
# kubernetes/components/hermes-bot/task-board instantiates with ./template
# once per bot, and the board's one webhook Job. No postBuild substitution:
# the scripts are Ruby. docs/openproject.md, "Bot provisioning" and "Waking
# a bot".
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openproject-bot-provisioner
spec:
  dependsOn:
    - name: openproject
  # Jobs are immutable: replace the webhook Job when its template changes.
  force: true
  interval: 1h
  path: ./kubernetes/apps/openproject/bot-provisioner/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: openproject
