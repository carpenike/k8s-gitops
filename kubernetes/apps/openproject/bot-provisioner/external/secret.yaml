---
# Empty on purpose; the Job fills it (OPENPROJECT_API_TOKEN, OPENPROJECT_USER,
# OPENPROJECT_USER_ID, OPENPROJECT_PROJECT). IfNotPresent: Flux creates it
# once and never reapplies it, so the Job's data stays. Nothing in the
# cluster reads it; Ryan copies the token to the bot.
apiVersion: v1
kind: Secret
metadata:
  name: openproject-bot-${BOT_NAME}
  namespace: openproject
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
  labels:
    app.kubernetes.io/name: openproject-bot-provisioner
    app.kubernetes.io/instance: ${BOT_NAME}
type: Opaque
