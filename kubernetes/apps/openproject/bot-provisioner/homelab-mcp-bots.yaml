# Bots that reach the board through homelab-mcp (docs/apps/openproject.md,
# "Bots through homelab-mcp"): one token each, in a Secret homelab-mcp mounts.
# No targetNamespace: the Job is in openproject, the Secret in homelab-mcp.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homelab-mcp-bot-claude
spec:
  dependsOn:
    - name: openproject-bot-provisioner
  force: true
  interval: 1h
  path: ./kubernetes/apps/openproject/bot-provisioner/homelab-mcp
  postBuild:
    substitute:
      BOT_NAME: claude
      BOT_DISPLAY_NAME: Claude
      TASK_BOARD_RYAN_USER_ID: "4"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  timeout: 15m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homelab-mcp-bot-grokbot
spec:
  dependsOn:
    - name: openproject-bot-provisioner
  force: true
  interval: 1h
  path: ./kubernetes/apps/openproject/bot-provisioner/homelab-mcp
  postBuild:
    substitute:
      BOT_NAME: grokbot
      BOT_DISPLAY_NAME: Grokbot
      TASK_BOARD_RYAN_USER_ID: "4"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  timeout: 15m
