---
# Empty until the Job fills it; IfNotPresent so Flux never wipes the token.
apiVersion: v1
kind: Secret
metadata:
  name: homelab-mcp-openproject-${BOT_NAME}
  namespace: homelab-mcp
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
  labels:
    app.kubernetes.io/name: openproject-bot-provisioner
    app.kubernetes.io/instance: ${BOT_NAME}
type: Opaque
