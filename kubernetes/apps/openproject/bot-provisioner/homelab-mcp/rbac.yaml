---
# The Job runs in openproject; the Secret it writes lives in homelab-mcp, so
# the Role and RoleBinding live there, on that one Secret only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homelab-provision-${BOT_NAME}
  namespace: openproject
  labels:
    app.kubernetes.io/name: openproject-bot-provisioner
    app.kubernetes.io/instance: ${BOT_NAME}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openproject-provision-${BOT_NAME}
  namespace: homelab-mcp
  labels:
    app.kubernetes.io/name: openproject-bot-provisioner
    app.kubernetes.io/instance: ${BOT_NAME}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - homelab-mcp-openproject-${BOT_NAME}
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openproject-provision-${BOT_NAME}
  namespace: homelab-mcp
  labels:
    app.kubernetes.io/name: openproject-bot-provisioner
    app.kubernetes.io/instance: ${BOT_NAME}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openproject-provision-${BOT_NAME}
subjects:
  - kind: ServiceAccount
    name: homelab-provision-${BOT_NAME}
    namespace: openproject
