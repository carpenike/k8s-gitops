---
# Empty on purpose; the Job fills it (OPENPROJECT_API_TOKEN, OPENPROJECT_USER,
# OPENPROJECT_USER_ID, OPENPROJECT_PROJECT). RBAC cannot limit create to one
# name, so Flux creates the object and the Job only gets get and patch on
# it. IfNotPresent: Flux creates it once and never reapplies it, so the
# Job's data stays. Pruning the bot's task-board Kustomization deletes it.
# The agent reads it with envFrom (optional).
apiVersion: v1
kind: Secret
metadata:
  name: hermes-${BOT_NAME}-openproject
  namespace: hermes-${BOT_NAME}
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
  labels:
    app.kubernetes.io/name: openproject-bot-provisioner
    app.kubernetes.io/instance: ${BOT_NAME}
type: Opaque
