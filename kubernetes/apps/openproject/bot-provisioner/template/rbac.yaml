---
# The Job's identity. automountServiceAccountToken stays on: the script
# patches the bot's Secret with it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-provision-${BOT_NAME}
  namespace: openproject
  labels:
    app.kubernetes.io/name: openproject-bot-provisioner
    app.kubernetes.io/instance: ${BOT_NAME}
---
# One Secret by name, get and patch only. No list, watch, create, delete,
# or update, and nothing in any other namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openproject-provision-${BOT_NAME}
  namespace: hermes-${BOT_NAME}
  labels:
    app.kubernetes.io/name: openproject-bot-provisioner
    app.kubernetes.io/instance: ${BOT_NAME}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - hermes-${BOT_NAME}-openproject
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openproject-provision-${BOT_NAME}
  namespace: hermes-${BOT_NAME}
  labels:
    app.kubernetes.io/name: openproject-bot-provisioner
    app.kubernetes.io/instance: ${BOT_NAME}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openproject-provision-${BOT_NAME}
subjects:
  - kind: ServiceAccount
    name: hermes-provision-${BOT_NAME}
    namespace: openproject
