---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Item openproject in vault k8s-secrets, field database_password: the
# postgres17 role's password (cnpg-system reads the same field). The chart
# reads key "password" (postgresql.auth.secretKeys.userPasswordKey).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openproject-db
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: openproject-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: openproject
        password: "{{ .database_password }}"
  data:
    - secretKey: database_password
      remoteRef:
        key: openproject/database_password
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Rails SECRET_KEY_BASE (cookies, signed tokens) and the first admin's
# password, seeded once on the first install (OpenProject forces a change at
# first sign-in). Both from item openproject.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openproject-secrets
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: openproject-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        secret-key-base: "{{ .secret_key_base }}"
        admin-password: "{{ .admin_password }}"
  data:
    - secretKey: secret_key_base
      remoteRef:
        key: openproject/secret_key_base
    - secretKey: admin_password
      remoteRef:
        key: openproject/admin_password
