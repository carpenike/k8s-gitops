---
# Internal gateway only (LAN and VPN); mikrotik-dns publishes it. No auth
# label, so the gateway's Pocket ID login applies (docs/gateway-auth.md),
# then OpenProject's own sign-in. Bots don't come this way: they use the
# in-cluster Service with API tokens.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openproject
spec:
  hostnames:
    - tasks.${SECRET_DOMAIN}
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - timeouts:
        request: 300s
        backendRequest: 300s
      backendRefs:
        - name: openproject
          port: 8080
