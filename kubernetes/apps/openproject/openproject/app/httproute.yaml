---
# Internal gateway only (LAN and VPN); mikrotik-dns publishes it.
# One login per route (docs/gateway-auth.md): OpenProject's OIDC is
# Enterprise-only, so the only login is OpenProject's own account with 2FA,
# and the route is labelled app to replace the gateway's Pocket ID login.
# The ReferenceGrant lets pocket-id-exempt in namespace network select it.
# Bots don't come this way: they use the in-cluster Service with API tokens.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openproject
  labels:
    gateway.holthome.net/auth: app
spec:
  hostnames:
    - tasks.${SECRET_DOMAIN}
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - timeouts:
        request: 300s
        backendRequest: 300s
      backendRefs:
        - name: openproject
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: openproject-gateway-auth
spec:
  from:
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: network
  to:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: openproject
