---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Streamable-HTTP MCP server at http://openproject-mcp.openproject.svc.cluster.local:8000/mcp
# for the bots' task board (images/openproject-mcp, docs/openproject.md).
# Stateless and secret-free: a bot's Hermes sends its own OpenProject API
# token as the bearer, and every OpenProject call is made as that bot.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openproject-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: openproject-mcp
  interval: 1h
  values:
    controllers:
      openproject-mcp:
        containers:
          app:
            image:
              repository: ghcr.io/carpenike/openproject-mcp
              # Built from images/openproject-mcp by openproject-mcp-image.yaml.
              # Floating tag, digest re-pinned by Renovate. The first digest is
              # the branch build 0.1.0-a7823be.
              tag: 0.1.0@sha256:86316d77ad0f84999d82ce29faa41d02d857a38276b1fa299aed254b9219d753
            env:
              OPENPROJECT_URL: http://openproject.openproject.svc.cluster.local:8080
              # Links the tools hand back, for Ryan to open.
              OPENPROJECT_PUBLIC_URL: https://tasks.${SECRET_DOMAIN}
              # The board project the provisioning Job creates (BOARD_PROJECT
              # in bot-provisioner/template/job.yaml). Without a default,
              # create_task needs a project on every call, and the skill
              # task-board doesn't name one.
              OPENPROJECT_DEFAULT_PROJECT: bots
              PORT: "8000"
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8000
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8000
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
    service:
      app:
        controller: openproject-mcp
        ports:
          http:
            port: 8000
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
