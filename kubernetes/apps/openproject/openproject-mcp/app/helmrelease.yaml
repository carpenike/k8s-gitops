---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Streamable-HTTP MCP server at http://openproject-mcp.openproject.svc.cluster.local:8000/mcp
# for the bots' task board (images/openproject-mcp, docs/openproject.md).
# Stateless: a bot's Hermes sends its own OpenProject API token as the
# bearer, and every OpenProject call is made as that bot. It also serves the
# board webhook's relay at /hooks/openproject (docs/openproject.md, "Waking a
# bot"), whose two HMAC keys are its only secrets.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openproject-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: openproject-mcp
  interval: 1h
  values:
    controllers:
      openproject-mcp:
        annotations:
          # Restart when Secret openproject-mcp-relay or
          # openproject-mcp-relay-targets changes.
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/carpenike/openproject-mcp
              # Built from images/openproject-mcp by openproject-mcp-image.yaml.
              # Floating tag, digest re-pinned by Renovate. This digest is the
              # branch build 0.2.0-d560435 (the task-board relay).
              tag: 0.2.0@sha256:00d6b803562349f2b052e1719d8e062e93a3fa98f0c73abfc34660e31a49fd73
            env:
              OPENPROJECT_URL: http://openproject.openproject.svc.cluster.local:8080
              # Links the tools hand back, for Ryan to open.
              OPENPROJECT_PUBLIC_URL: https://tasks.${SECRET_DOMAIN}
              # The board project the provisioning Job creates (BOARD_PROJECT
              # in bot-provisioner/template/job.yaml). Without a default,
              # create_task needs a project on every call, and the skill
              # task-board doesn't name one.
              OPENPROJECT_DEFAULT_PROJECT: bots
              PORT: "8000"
              # The bots the relay may wake, by OpenProject login. A Hermes
              # bot needs TASK_BOARD_WEBHOOK_ENABLED=true in its inputs; a bot
              # outside the cluster needs an entry in RELAY_TARGETS (Secret
              # openproject-mcp-relay-targets) and an egress rule in this
              # app's CNP. Otherwise its event has nowhere to go (the relay
              # logs and moves on).
              RELAY_BOTS: chief,hank,chief-engineer
            # OPENPROJECT_WEBHOOK_SECRET and HERMES_WEBHOOK_SECRET. Without
            # them the relay answers 404 and the MCP server works as before.
            envFrom:
              - secretRef:
                  name: openproject-mcp-relay
                  optional: true
              # RELAY_TARGETS, the webhook targets of bots outside the cluster.
              - secretRef:
                  name: openproject-mcp-relay-targets
                  optional: true
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8000
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8000
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
    service:
      app:
        controller: openproject-mcp
        # Pinned: OpenProject's webhook allowlist takes addresses, not names
        # (OPENPROJECT_SSRF__PROTECTION__IP__ALLOWLIST in
        # openproject/app/helmrelease.yaml). The address the Service already
        # had; change both together.
        clusterIP: 10.43.104.160
        ports:
          http:
            port: 8000
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
