---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The board webhook relay's two HMAC keys, from item openproject in vault
# k8s-secrets (docs/apps/openproject.md, "Waking a bot"):
#   webhook_secret      OpenProject signs the webhook with it (the
#                       bot-provisioner's webhook Job reads the same field);
#   bot_webhook_secret  the relay signs each bot's event with it (each bot's
#                       ExternalSecret task-board-webhook reads the same field).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openproject-mcp-relay
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: openproject-mcp-relay
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OPENPROJECT_WEBHOOK_SECRET: "{{ .webhook_secret }}"
        HERMES_WEBHOOK_SECRET: "{{ .bot_webhook_secret }}"
  data:
    - secretKey: webhook_secret
      remoteRef:
        key: openproject/webhook_secret
    - secretKey: bot_webhook_secret
      remoteRef:
        key: openproject/bot_webhook_secret
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Webhook targets for bots outside the cluster (docs/apps/openproject.md, "Bots
# outside the cluster"), as RELAY_TARGETS. Chief Engineer: item
# chief-engineer in vault k8s-secrets, fields routine_url (the Grok Bot
# routine's "POST to" URL) and routine_key (its key). The URL stays out of
# git: it names the routine. A missing item leaves this unready and Secret
# openproject-mcp-relay-targets absent; the relay then skips that bot.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openproject-mcp-relay-targets
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: openproject-mcp-relay-targets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        RELAY_TARGETS: '{"chief-engineer": {"url": {{ .ce_routine_url | toJson }}, "bearer": {{ .ce_routine_key | toJson }}}}'
  data:
    - secretKey: ce_routine_url
      remoteRef:
        key: chief-engineer/routine_url
    - secretKey: ce_routine_key
      remoteRef:
        key: chief-engineer/routine_key
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The Alertmanager relay's bearer token (images/openproject-mcp README,
# "Alertmanager relay"): item openproject, field alertmanager_hook_token.
# Forge's Alertmanager sends the same value (nix-config sops
# alerting/hank-webhook-auth). Its own ExternalSecret, so a missing field
# leaves only the alert relay off (503), never the board relay.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openproject-mcp-alerts
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: openproject-mcp-alerts
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ALERTMANAGER_HOOK_TOKEN: "{{ .alertmanager_hook_token }}"
  data:
    - secretKey: alertmanager_hook_token
      remoteRef:
        key: openproject/alertmanager_hook_token
