---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The board webhook relay's two HMAC keys, from item openproject in vault
# k8s-secrets (docs/openproject.md, "Waking a bot"):
#   webhook_secret      OpenProject signs the webhook with it (the
#                       bot-provisioner's webhook Job reads the same field);
#   bot_webhook_secret  the relay signs each bot's event with it (each bot's
#                       ExternalSecret task-board-webhook reads the same field).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openproject-mcp-relay
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: openproject-mcp-relay
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OPENPROJECT_WEBHOOK_SECRET: "{{ .webhook_secret }}"
        HERMES_WEBHOOK_SECRET: "{{ .bot_webhook_secret }}"
  data:
    - secretKey: webhook_secret
      remoteRef:
        key: openproject/webhook_secret
    - secretKey: bot_webhook_secret
      remoteRef:
        key: openproject/bot_webhook_secret
