---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# MCP server for the bots' task board (images/openproject-mcp,
# docs/apps/openproject.md "Bot access"). Its own Kustomization, so a bad image
# never makes OpenProject itself unhealthy.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openproject-mcp
spec:
  dependsOn:
    - name: openproject
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: openproject-mcp
      namespace: openproject
  interval: 1h
  path: ./kubernetes/apps/openproject/openproject-mcp/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: openproject
  timeout: 10m
