---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The health server's only secret: a DSN for lading_reader. /healthz is
# SELECTs on ingest_runs (src/lading/app.py), so the read-only role is
# enough. Forge used the owner role and ran lading-migrate before the health
# unit; here only the sync jobs migrate, so on an empty database /healthz
# reads "error" until the first sync (after the cutover restore the schema
# is already there). Item lading, field reader_password (docs/postgres17.md,
# "Forge stores"). Passwords are URL-encoded into the DSN.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lading
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: lading-health
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        LADING_DATABASE_URL: "postgresql://lading_reader:{{ .reader_password | urlquery }}@postgres17-rw.cnpg-system.svc.cluster.local:5432/lading?sslmode=require"
  data:
    - secretKey: reader_password
      remoteRef:
        key: lading/reader_password
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Ryan's sync environment, Forge's sops template lading-sync-ryan-env: the
# owner DSN and ONE Amazon account's username, password and TOTP seed. That
# credential can place orders; only the sync-ryan pod reads this Secret.
# Item lading-ryan (new) plus item lading, field db_password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lading-ryan
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: lading-ryan
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        LADING_DATABASE_URL: "postgresql://lading:{{ .db_password | urlquery }}@postgres17-rw.cnpg-system.svc.cluster.local:5432/lading?sslmode=require"
        LADING_AMAZON_USERNAME: "{{ .amazon_username }}"
        LADING_AMAZON_PASSWORD: "{{ .amazon_password }}"
        LADING_AMAZON_OTP_SECRET_KEY: "{{ .amazon_otp_secret_key }}"
  data:
    - secretKey: db_password
      remoteRef:
        key: lading/db_password
    - secretKey: amazon_username
      remoteRef:
        key: lading-ryan/amazon_username
    - secretKey: amazon_password
      remoteRef:
        key: lading-ryan/amazon_password
    - secretKey: amazon_otp_secret_key
      remoteRef:
        key: lading-ryan/amazon_otp_secret_key
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Ryan's Costco and Sam's Club token SEEDS, as files for the seed init
# container. Seeds only: the live, rotating tokens are on lading-ryan-state,
# and the seed is installed only when no live file exists. Updating these
# fields does nothing to a volume that already has tokens (docs/lading.md,
# "Re-seeding").
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lading-ryan-seeds
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: lading-ryan-seeds
    creationPolicy: Owner
  data:
    - secretKey: costco_tokens
      remoteRef:
        key: lading-ryan/costco_tokens
    - secretKey: samsclub_tokens
      remoteRef:
        key: lading-ryan/samsclub_tokens
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Steffi's sync environment, Forge's lading-sync-steffi-env. Same shape as
# ryan's, her own account. Item lading-steffi (new) plus item lading, field
# db_password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lading-steffi
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: lading-steffi
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        LADING_DATABASE_URL: "postgresql://lading:{{ .db_password | urlquery }}@postgres17-rw.cnpg-system.svc.cluster.local:5432/lading?sslmode=require"
        LADING_AMAZON_USERNAME: "{{ .amazon_username }}"
        LADING_AMAZON_PASSWORD: "{{ .amazon_password }}"
        LADING_AMAZON_OTP_SECRET_KEY: "{{ .amazon_otp_secret_key }}"
  data:
    - secretKey: db_password
      remoteRef:
        key: lading/db_password
    - secretKey: amazon_username
      remoteRef:
        key: lading-steffi/amazon_username
    - secretKey: amazon_password
      remoteRef:
        key: lading-steffi/amazon_password
    - secretKey: amazon_otp_secret_key
      remoteRef:
        key: lading-steffi/amazon_otp_secret_key
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Steffi's Costco token seed (her own membership). No Sam's Club seed: Forge
# enables Sam's Club for ryan only.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lading-steffi-seeds
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: lading-steffi-seeds
    creationPolicy: Owner
  data:
    - secretKey: costco_tokens
      remoteRef:
        key: lading-steffi/costco_tokens
