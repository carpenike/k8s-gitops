---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: lading
spec:
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: external-secrets
      namespace: external-secrets
    - name: prometheus-operator-crds
      namespace: observability
    - name: postgres17
      namespace: cnpg-system
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: lading
      namespace: lading
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: lading-ryan
      namespace: lading
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: lading-ryan-seeds
      namespace: lading
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: lading-steffi
      namespace: lading
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: lading-steffi-seeds
      namespace: lading
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: lading
      namespace: lading
  interval: 1h
  path: ./kubernetes/apps/lading/lading/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: lading
  timeout: 10m
