---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-webhook-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: flux-webhook-token
    creationPolicy: Owner
  data:
    # v1 had no Flux Receiver token. The actions-runner webhook field is a
    # different secret. Proposed item: flux-webhook. Field: token.
    - secretKey: token
      remoteRef:
        key: PLACEHOLDER_ITEM_flux-webhook
        property: token
