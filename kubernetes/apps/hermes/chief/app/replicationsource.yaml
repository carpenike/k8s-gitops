---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/volsync.backube/replicationsource_v1alpha1.json
# The volume holds the Matrix crypto store; losing it means Chief cannot
# read older encrypted messages. Same shape as matrix/tuwunel.
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: chief
spec:
  sourcePVC: chief-data
  trigger:
    schedule: "45 3 * * *"
  restic:
    copyMethod: Snapshot
    repository: chief-volsync
    pruneIntervalDays: 7
    cacheCapacity: 2Gi
    volumeSnapshotClassName: csi-ceph-block
    storageClassName: ceph-block
    moverPodLabels:
      app.kubernetes.io/name: chief-volsync
    moverSecurityContext:
      runAsNonRoot: true
      runAsUser: 10000
      runAsGroup: 10000
      fsGroup: 10000
      seccompProfile:
        type: RuntimeDefault
    retain:
      daily: 7
      weekly: 4
