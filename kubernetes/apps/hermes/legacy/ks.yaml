---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Legacy Chief, replicas 0. No postBuild substitution: the init script carries a literal
# ${LITELLM_API_KEY} that Hermes expands at runtime.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: chief
spec:
  dependsOn:
    - name: kata
      namespace: kube-system
    - name: litellm
      namespace: litellm
    - name: external-secrets
      namespace: external-secrets
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: ceph-csi-drivers
      namespace: rook-ceph
    - name: volsync
      namespace: volsync-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: chief
      namespace: hermes
  interval: 1h
  path: ./kubernetes/apps/hermes/legacy/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: hermes
  timeout: 15m
