# Hermes agents run commands on behalf of whoever talks to them, so each
# pod is a kata-qemu VM (ADR 0009). Inside the VM they still run as the
# image's hermes user (10000) with no capabilities: the image accepts that
# UID when its entrypoint is not PID 1 (shareProcessNamespace), so
# restricted fits. See docs/hermes.md.
apiVersion: v1
kind: Namespace
metadata:
  name: hermes
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
