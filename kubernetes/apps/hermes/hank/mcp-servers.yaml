---
# Hank's MCP servers from git (docs/apps/hermes.md, "MCP servers from git"). The
# config init container writes each entry into config.yaml on every start.
# Each server also needs egress: public hosts go in mcp-egress.yaml.
servers:
  # Up-to-date library and CLI docs for Claude Code work. Public, no key
  # (rate-limited without one). Read-only, so no approval prompt.
  context7:
    url: https://mcp.context7.com/mcp
    trust: full
    timeout: 60
    tools:
      - resolve-library-id
      - query-docs
  # The shared task board (docs/apps/openproject.md, "Bot access"), as OpenProject
  # user hank. In-cluster, so its egress is the component's agent-task-board
  # (TASK_BOARD_ENABLED), not mcp-egress.yaml. OPENPROJECT_API_TOKEN comes
  # from Secret hermes-hank-openproject, which the provisioning Job fills.
  # trust full: the writes stay on the board, under Hank's own name, and the
  # skill task-board says what a task does and doesn't authorize.
  openproject:
    url: http://openproject-mcp.openproject.svc.cluster.local:8000/mcp
    headers:
      Authorization: "Bearer ${OPENPROJECT_API_TOKEN}"
    trust: full
    timeout: 60
    tools:
      - whoami
      - list_tasks
      - get_task
      - create_task
      - add_comment
      - claim_next
      - complete_task
      - release_task
