---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# The screen pod's route to the Kubernetes API, for kubectl and flux. Nothing
# else is added: its public egress stays as the component sets it.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: screen-kube-apiserver
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: hermes
      app.kubernetes.io/controller: screen
  egress:
    - toEntities:
        - kube-apiserver
