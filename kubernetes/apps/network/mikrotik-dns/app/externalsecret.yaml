---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mikrotik-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: mikrotik-credentials
    creationPolicy: Owner
  data:
    # v1 internal DNS was item bind (externaldns_algorithm, externaldns_secret).
    # That is RFC2136, not this webhook. Proposed item: mikrotik.
    - secretKey: MIKROTIK_BASEURL
      remoteRef:
        key: PLACEHOLDER_ITEM_mikrotik-dns
        property: baseurl
    - secretKey: MIKROTIK_USERNAME
      remoteRef:
        key: PLACEHOLDER_ITEM_mikrotik-dns
        property: username
    - secretKey: MIKROTIK_PASSWORD
      remoteRef:
        key: PLACEHOLDER_ITEM_mikrotik-dns
        property: password
