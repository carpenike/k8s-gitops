---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mikrotik-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: mikrotik-credentials
    creationPolicy: Owner
  data:
    # Item mikrotik in vault k8s-secrets. baseurl is https://10.20.0.1.
    - secretKey: MIKROTIK_BASEURL
      remoteRef:
        key: mikrotik/baseurl
    - secretKey: MIKROTIK_USERNAME
      remoteRef:
        key: mikrotik/username
    - secretKey: MIKROTIK_PASSWORD
      remoteRef:
        key: mikrotik/password
