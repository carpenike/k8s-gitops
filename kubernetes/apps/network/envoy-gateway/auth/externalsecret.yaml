# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Item pocket-id-gateway in vault k8s-secrets. Fields client_id and
# client_secret. Envoy Gateway reads secret keys client-id and client-secret.
# The item does not exist until the Pocket ID client is created.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: pocket-id-gateway
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: pocket-id-gateway/client_id
    - secretKey: client-secret
      remoteRef:
        key: pocket-id-gateway/client_secret
