---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# v1 extracted item Cloudflare and rewrote each field with a cloudflare_
# prefix. The item fields are tunnel_account_tag, tunnel_secret, tunnel_id.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-tunnel-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: cloudflare-tunnel-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        credentials.json: |
          {
            "AccountTag": "{{ .tunnel_account_tag }}",
            "TunnelSecret": "{{ .tunnel_secret }}",
            "TunnelID": "{{ .tunnel_id }}"
          }
        TunnelID: "{{ .tunnel_id }}"
  data:
    - secretKey: tunnel_account_tag
      remoteRef:
        key: Cloudflare
        property: tunnel_account_tag
    - secretKey: tunnel_secret
      remoteRef:
        key: Cloudflare
        property: tunnel_secret
    - secretKey: tunnel_id
      remoteRef:
        key: Cloudflare
        property: tunnel_id
