---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The health server's only secret: a DSN for schoolhouse_reader. /healthz and
# /metrics are SELECTs on ingest_runs, parser_gaps and courses
# (src/schoolhouse/app.py, metrics.py), so the read-only role is enough.
# Forge used the owner role here; postgres17 has a reader, so this uses it.
# Item schoolhouse, field reader_password (docs/postgres17.md, "Forge
# stores"). Passwords are URL-encoded into the DSN.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: schoolhouse
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: schoolhouse-health
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SCHOOLHOUSE_DATABASE_URL: "postgresql://schoolhouse_reader:{{ .reader_password | urlquery }}@postgres17-rw.cnpg-system.svc.cluster.local:5432/schoolhouse?sslmode=require"
  data:
    - secretKey: reader_password
      remoteRef:
        key: schoolhouse/reader_password
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The ingest's environment, Forge's sops template schoolhouse-ingest-env:
# the owner DSN (migrations and writes), the parent Schoology login, the
# children map ({"<schoology uid>": "<name>"}, identifies minors) and the
# per-child iCal share URLs ({"<uid>": "https://..."} or {}), which are
# capability URLs and as sensitive as the password. Item schoolhouse-ingest
# (new) plus item schoolhouse, field db_password. Forge sets no IMAP
# variables, so the digest source stays off here too.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: schoolhouse-ingest
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: schoolhouse-ingest
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SCHOOLHOUSE_DATABASE_URL: "postgresql://schoolhouse:{{ .db_password | urlquery }}@postgres17-rw.cnpg-system.svc.cluster.local:5432/schoolhouse?sslmode=require"
        SCHOOLHOUSE_SCHOOLOGY_USERNAME: "{{ .schoology_username }}"
        SCHOOLHOUSE_SCHOOLOGY_PASSWORD: "{{ .schoology_password }}"
        SCHOOLHOUSE_CHILDREN: "{{ .children }}"
        SCHOOLHOUSE_ICAL_FEEDS: "{{ .ical_feeds }}"
  data:
    - secretKey: db_password
      remoteRef:
        key: schoolhouse/db_password
    - secretKey: schoology_username
      remoteRef:
        key: schoolhouse-ingest/schoology_username
    - secretKey: schoology_password
      remoteRef:
        key: schoolhouse-ingest/schoology_password
    - secretKey: children
      remoteRef:
        key: schoolhouse-ingest/children
    - secretKey: ical_feeds
      remoteRef:
        key: schoolhouse-ingest/ical_feeds
