---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Stalwart's recovery administrator (item stalwart, field admin_password,
# the same field as ../app/externalsecret.yaml). vandelay export reads it
# from VANDELAY_PASSWORD with --auth-basic admin and writes to a user's
# account with --account-name.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stalwart-migration
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: stalwart-migration
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        VANDELAY_PASSWORD: "{{ .admin_password }}"
  data:
    - secretKey: admin_password
      remoteRef:
        key: stalwart/admin_password
