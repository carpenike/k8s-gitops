---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Item stalwart in vault k8s-secrets.
# - database_password: role stalwart on postgres17. cnpg-system reads the
#   same field (stalwart-db in ../../../cnpg-system/postgres17/app).
# - admin_password: Stalwart accepts STALWART_RECOVERY_ADMIN (user:password)
#   as an administrator whenever it is set
#   (crates/common/src/auth/authentication.rs at v1.1.0), so it is the first
#   login and the break-glass account afterwards.
# - cloudflare_api_token: Cloudflare token with Zone / Zone / Read and
#   Zone / DNS / Edit on zone holthome.net only. Stalwart's Cloudflare DNS
#   provider reads it as EnvironmentVariable STALWART_CLOUDFLARE_TOKEN to
#   publish and rotate the domain's mail records (docs/mail.md, "DNS").
#   Not the external-dns token, which covers five zones.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stalwart
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: stalwart
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        STALWART_DB_PASSWORD: "{{ .database_password }}"
        STALWART_RECOVERY_ADMIN: "admin:{{ .admin_password }}"
        STALWART_CLOUDFLARE_TOKEN: "{{ .cloudflare_api_token }}"
  data:
    - secretKey: database_password
      remoteRef:
        key: stalwart/database_password
    - secretKey: admin_password
      remoteRef:
        key: stalwart/admin_password
    - secretKey: cloudflare_api_token
      remoteRef:
        key: stalwart/cloudflare_api_token
