---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Item stalwart in vault k8s-secrets, field admin_password. Stalwart accepts
# STALWART_RECOVERY_ADMIN (user:password) as an administrator whenever it is
# set (crates/common/src/auth/authentication.rs at v1.1.0), so it is the
# first login and the break-glass account afterwards. Rotate it in 1Password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stalwart
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: stalwart
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        STALWART_RECOVERY_ADMIN: "admin:{{ .admin_password }}"
  data:
    - secretKey: admin_password
      remoteRef:
        key: stalwart/admin_password
