---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Item stalwart in vault k8s-secrets.
# - database_password: role stalwart on postgres17. cnpg-system reads the
#   same field (stalwart-db in ../../../cnpg-system/postgres17/app).
# - admin_password: Stalwart accepts STALWART_RECOVERY_ADMIN (user:password)
#   as an administrator whenever it is set
#   (crates/common/src/auth/authentication.rs at v1.1.0), so it is the first
#   login and the break-glass account afterwards.
# - cloudflare_api_token: Cloudflare token with Zone / Zone / Read and
#   Zone / DNS / Edit on zones holthome.net, ryanholt.net, stefanieholt.com
#   and devialea.com. Stalwart's Cloudflare DNS
#   provider reads it as EnvironmentVariable STALWART_CLOUDFLARE_TOKEN to
#   publish and rotate the domain's mail records (docs/apps/mail.md, "DNS").
#   Not the external-dns token, which covers five zones.
# - smtp2go_password: password of the SMTP2GO SMTP user. MtaRoute/Relay
#   "smtp2go" reads it as EnvironmentVariable STALWART_SMTP2GO_PASSWORD
#   (outbound path, ADR 0014; docs/apps/mail.md, "Outbound"). The
#   user name is not secret and is set on the route itself; field
#   smtp2go_username keeps it beside the password, unread by the cluster.
# - edge_relay_password: password of account relay@mx.holthome.net on the
#   edge relay. MtaRoute/Relay "edge" reads it as EnvironmentVariable
#   STALWART_EDGE_RELAY_PASSWORD (ADR 0014, "Fallback path through the
#   edge"). The edge's own store holds the same value.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stalwart
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: stalwart
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        STALWART_DB_PASSWORD: "{{ .database_password }}"
        STALWART_RECOVERY_ADMIN: "admin:{{ .admin_password }}"
        STALWART_CLOUDFLARE_TOKEN: "{{ .cloudflare_api_token }}"
        STALWART_SMTP2GO_PASSWORD: "{{ .smtp2go_password }}"
        STALWART_EDGE_RELAY_PASSWORD: "{{ .edge_relay_password }}"
  data:
    - secretKey: database_password
      remoteRef:
        key: stalwart/database_password
    - secretKey: admin_password
      remoteRef:
        key: stalwart/admin_password
    - secretKey: cloudflare_api_token
      remoteRef:
        key: stalwart/cloudflare_api_token
    - secretKey: smtp2go_password
      remoteRef:
        key: stalwart/smtp2go_password
    - secretKey: edge_relay_password
      remoteRef:
        key: stalwart/edge_relay_password
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Basic auth for Stalwart's Prometheus endpoint (/metrics/prometheus). The
# HTTPRoute sends every path on mail.${SECRET_DOMAIN} to 8080, so without
# a password the LAN and tailnet could read it. Stalwart reads the password
# as EnvironmentVariable STALWART_METRICS_PASSWORD (Metrics › Prometheus);
# the ServiceMonitor reads both keys. Item stalwart, field
# metrics_password. Missing field: this stays unready, Secret
# stalwart-metrics is never created, and the scrape gets 401.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stalwart-metrics
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: stalwart-metrics
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        STALWART_METRICS_USERNAME: prometheus
        STALWART_METRICS_PASSWORD: "{{ .metrics_password }}"
  data:
    - secretKey: metrics_password
      remoteRef:
        key: stalwart/metrics_password
