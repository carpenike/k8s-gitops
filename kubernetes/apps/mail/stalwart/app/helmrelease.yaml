---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# ADR 0013 and docs/mail.md.
#
# One replica, Recreate. Every store (data, blobs, full-text search,
# in-memory) is RocksDB on one ceph-block RWO volume, and RocksDB holds a
# lock on it. Ceph keeps three copies across the sleds; VolSync takes the
# copy that leaves the chassis (../backup).
#
# Stalwart 1.x keeps only the datastore on disk (config.json below).
# Domains, accounts, listeners, DKIM, spam rules and certificates are JMAP
# objects inside that store, managed from the WebUI or stalwart-cli apply.
# On an empty store Stalwart creates the listeners smtp 25, submissions 465,
# imaps 993, pop3s 995, sieve 4190, https 443 and http 8080
# (crates/common/src/manager/defaults.rs at v1.1.0).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stalwart
spec:
  chartRef:
    kind: OCIRepository
    name: stalwart
  interval: 1h
  timeout: 10m
  values:
    controllers:
      stalwart:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          terminationGracePeriodSeconds: 120
        containers:
          app:
            image:
              repository: docker.io/stalwartlabs/stalwart
              # renovate: datasource=docker depName=docker.io/stalwartlabs/stalwart
              tag: v1.1.0@sha256:f772aa6ef8cd8018969fa491640f1436b0270eb14e2c219b5f37f1a77020837e
            args:
              - --config
              - /etc/stalwart/config.json
            env:
              # SMTP greeting and EHLO name. Must match the MX host and its PTR.
              STALWART_HOSTNAME: mx.${SECRET_DOMAIN}
              # Base URL in OAuth, OIDC and JMAP discovery documents.
              STALWART_PUBLIC_URL: https://mail.${SECRET_DOMAIN}
            envFrom:
              - secretRef:
                  name: stalwart
            # Exec, not HTTP, so the network policy needs no host ingress.
            # The image ships curl for its own HEALTHCHECK.
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec: &healthcheck
                    command:
                      - curl
                      - -fsS
                      - -o
                      - /dev/null
                      - http://127.0.0.1:8080/healthz/live
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  exec: *healthcheck
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  exec: *healthcheck
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: "2"
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
        # The image grants cap_net_bind_service as a file capability, which
        # allowPrivilegeEscalation: false (no_new_privs) ignores. This safe,
        # namespaced sysctl lets the non-root process bind 25, 465 and 993.
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: "0"
    service:
      # Mail protocols on their own LoadBalancer address, advertised by
      # Cilium BGP. externalTrafficPolicy Local keeps the client address,
      # which SPF, DNSBL lookups, rate limits and the network policy need.
      mail:
        controller: stalwart
        forceRename: stalwart-mail
        type: LoadBalancer
        externalTrafficPolicy: Local
        annotations:
          lbipam.cilium.io/ips: "10.45.10.25"
        ports:
          smtp:
            port: 25
          submissions:
            port: 465
          submission:
            port: 587
          imaps:
            port: 993
          pop3s:
            port: 995
          sieve:
            port: 4190
      # WebUI, JMAP, CalDAV, CardDAV, WebDAV and autoconfig, behind
      # envoy-internal (httproute.yaml).
      http:
        controller: stalwart
        forceRename: stalwart
        primary: true
        ports:
          http:
            port: 8080
    configMaps:
      config:
        data:
          # The DataStore object (x:RocksDbStore in resources/schema at
          # v1.1.0). Blob, search and in-memory stores default to this one.
          config.json: |-
            {
              "@type": "RocksDb",
              "path": "/var/lib/stalwart/data"
            }
    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 50Gi
        storageClass: ceph-block
        retain: true
        # Fixed name for VolSync. See ../backup/replicationsource.yaml.
        forceRename: stalwart-data
        globalMounts:
          - path: /var/lib/stalwart
      config:
        type: configMap
        identifier: config
        globalMounts:
          - path: /etc/stalwart/config.json
            subPath: config.json
            readOnly: true
      tls:
        type: secret
        name: stalwart-tls
        defaultMode: 0440
        globalMounts:
          - path: /etc/stalwart/tls
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
