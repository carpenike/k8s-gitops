---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
# Mail alerts (docs/apps/mail.md, "Metrics" and "Monitoring the edge"). The
# cluster's Stalwart is job stalwart (ServiceMonitor, this app). The Vultr
# edge is jobs mx-edge-node and mx-edge-stalwart (ScrapeConfigs in
# observability, through a Tailscale egress proxy). Alerts route to Forge's
# Alertmanager like the rest.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mail
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: mail-edge
      rules:
        - alert: MailEdgeUnreachable
          # The VM, its tailnet link or the egress proxy is down. While it
          # lasts, senders hold mail for us and retry (usually for days).
          expr: |
            up{job="mx-edge-node"} == 0
              or absent(up{job="mx-edge-node"})
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: The mail edge relay (mx-edge) is unreachable
            description: >-
              Prometheus has had no node metrics from mx-edge for 10 minutes.
              Check the Vultr VM, `tailscale status`, and the egress proxy for
              Service observability/mx-edge in namespace tailscale.
        - alert: MailEdgeStalwartDown
          # Stalwart's metrics fail while the VM itself answers.
          expr: |
            (up{job="mx-edge-stalwart"} == 0 and on() up{job="mx-edge-node"} == 1)
              or (absent(up{job="mx-edge-stalwart"}) and on() up{job="mx-edge-node"} == 1)
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Stalwart on the mail edge is not answering
            description: >-
              mx-edge is up but its Stalwart metrics (8080, /metrics/prometheus)
              have failed for 10 minutes. Inbound mail is probably refused.
              `systemctl status podman-stalwart` on mx-edge. A 401 means the
              1Password field mx-edge/metrics_password and the edge's setting
              differ.
        - alert: MailEdgeStalwartServiceInactive
          expr: node_systemd_unit_state{job="mx-edge-node",name="podman-stalwart.service",state="active"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: podman-stalwart is not running on mx-edge
            description: >-
              The edge's Stalwart container unit has not been active for 5
              minutes, so inbound mail is refused.
        - alert: MailEdgeUpgradeFailed
          expr: node_systemd_unit_state{job="mx-edge-node",name="nixos-upgrade.service",state="failed"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: The nightly NixOS upgrade failed on mx-edge
            description: >-
              nixos-upgrade.service is in the failed state. The edge keeps its
              current system; `journalctl -u nixos-upgrade` on mx-edge says why.
        - alert: MailEdgeDiskFilling
          expr: |
            node_filesystem_avail_bytes{job="mx-edge-node",mountpoint="/"}
              / node_filesystem_size_bytes{job="mx-edge-node",mountpoint="/"} < 0.15
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: mx-edge's disk is over 85% full
            description: >-
              The edge's queue and RocksDB store live on /. A full disk stops it
              accepting mail.
    - name: mail-stalwart
      rules:
        - alert: StalwartDown
          expr: |
            up{namespace="mail",job="stalwart"} == 0
              or absent(up{namespace="mail",job="stalwart"})
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: The cluster's Stalwart is not being scraped
            description: >-
              No metrics from Stalwart in namespace mail for 10 minutes. Mail
              delivery to mailboxes, IMAP, JMAP and webmail are probably down;
              the edge relay queues inbound mail meanwhile.
        # Stalwart sets its queue-size gauge (queue.count, exported as
        # stalwart_queue_messages) only in the Enterprise edition
        # (crates/services/src/task_manager/scheduler.rs at v1.2.1), so
        # these two alerts use counters instead.
        - alert: MailEdgeNotDelivering
          # The edge hands every inbound message to the cluster's
          # smtp-edge (2525). Mail accepted for an hour with nothing
          # delivered means that hand-off is failing.
          expr: >-
            sum(increase(stalwart_queue_message_queued_total{job="mx-edge-stalwart"}[1h])) > 0
            and sum(increase(stalwart_delivery_delivered_total{job="mx-edge-stalwart"}[1h])) < 1
          labels:
            severity: warning
          annotations:
            summary: The edge relay accepted mail but delivered none in an hour
            description: >-
              Inbound mail is queued on the edge. Check that the cluster's
              Stalwart is up and that the edge reaches 10.45.10.25:2525 over
              the tailnet (nc -vz from the VM).
        - alert: MailDeliveryRetrying
          # Retries per hour. The edge's baseline is up to about 13, from
          # DMARC report collectors with broken certificates; the cluster
          # relays everything through SMTP2GO and normally has none.
          expr: >-
            sum by (job) (increase(stalwart_queue_rescheduled_total{job="mx-edge-stalwart"}[1h])) > 25
            or sum by (job) (increase(stalwart_queue_rescheduled_total{job="stalwart"}[1h])) > 5
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.job }}: mail deliveries are being retried"
            description: >-
              Messages are waiting in the queue for another attempt. On the
              edge that usually means the cluster's smtp-edge (2525) is
              unreachable; on the cluster, SMTP2GO is deferring them. Each
              server's WebUI lists its queue.
        - alert: StalwartAuthFailureBurst
          # Stalwart bans an address after 100 failures a day; this is the
          # early sign, for example a phone with a stale app password.
          expr: increase(stalwart_auth_failed_total{namespace="mail",job="stalwart"}[15m]) > 30
          labels:
            severity: warning
          annotations:
            summary: Over 30 failed Stalwart logins in 15 minutes
            description: >-
              Look at Stalwart's log for auth.failed and the remote addresses.
              Addresses outside 10.42.0.0/16 are banned after 100 failures a day.
