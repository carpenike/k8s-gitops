---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# ADR 0013 and docs/mail.md. All Stalwart state is RocksDB on one ceph-block
# volume; nothing here depends on postgres17.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: stalwart
spec:
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: ceph-csi-drivers
      namespace: rook-ceph
    - name: cert-manager
      namespace: cert-manager
    - name: envoy-gateway
      namespace: network
    - name: mikrotik-dns
      namespace: network
    - name: external-secrets
      namespace: external-secrets
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: stalwart
      namespace: mail
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: stalwart
      namespace: mail
  interval: 1h
  path: ./kubernetes/apps/mail/stalwart/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: mail
  timeout: 10m
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Nothing depends on this. If 1Password item volsync-r2-template cannot be
# read, this Kustomization stays unready and the mail server does not wait
# on it.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: stalwart-backup
spec:
  dependsOn:
    - name: stalwart
    - name: volsync
      namespace: volsync-system
    - name: external-secrets
      namespace: external-secrets
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: stalwart-volsync
      namespace: mail
  interval: 1h
  path: ./kubernetes/apps/mail/stalwart/backup
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: mail
