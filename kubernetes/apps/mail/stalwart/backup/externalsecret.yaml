---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Item stalwart-r2 in vault k8s-secrets, the same fields as postgres17-r2
# (docs/postgres17.md): an R2 API token with Object Read & Write on one
# bucket, its endpoint (contains the account id, so not in this public repo)
# and the bucket name. Objects land under stalwart/blobs/.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stalwart-r2
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: stalwart-r2
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        RCLONE_CONFIG_R2_ACCESS_KEY_ID: "{{ .access_key_id }}"
        RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: "{{ .secret_access_key }}"
        RCLONE_CONFIG_R2_ENDPOINT: "{{ .endpoint_url }}"
        R2_BUCKET: "{{ .bucket }}"
  data:
    - secretKey: access_key_id
      remoteRef:
        key: stalwart-r2/access_key_id
    - secretKey: secret_access_key
      remoteRef:
        key: stalwart-r2/secret_access_key
    - secretKey: endpoint_url
      remoteRef:
        key: stalwart-r2/endpoint_url
    - secretKey: bucket
      remoteRef:
        key: stalwart-r2/bucket
