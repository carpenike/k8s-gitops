---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Item bulwark in vault k8s-secrets.
# - session_secret: SESSION_SECRET, at least 32 characters. Signs Bulwark's
#   session cookies and encrypts the remembered sign-in it keeps in an
#   httpOnly cookie. Set here so a restart, which empties /app/data, does
#   not sign everyone out.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bulwark
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: bulwark
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SESSION_SECRET: "{{ .session_secret }}"
  data:
    - secretKey: session_secret
      remoteRef:
        key: bulwark/session_secret
