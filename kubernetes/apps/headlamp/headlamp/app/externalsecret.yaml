---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Headlamp's Pocket ID client. Item headlamp in vault k8s-secrets, field
# oidc_client_secret. The client id is fixed at `headlamp` because the API
# server's KubeAuthenticationConfig (talos/control-plane/20-authentication.yaml)
# lists it as the token audience; change both together. The chart reads
# this Secret with envFrom (config.oidc.externalSecret).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headlamp-oidc
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: headlamp-oidc
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OIDC_CLIENT_ID: headlamp
        OIDC_CLIENT_SECRET: "{{ .oidc_client_secret }}"
        OIDC_ISSUER_URL: https://id.${SECRET_DOMAIN}
        # Headlamp splits on commas. groups carries `admins` for RBAC.
        OIDC_SCOPES: openid,profile,email,groups
  data:
    - secretKey: oidc_client_secret
      remoteRef:
        key: headlamp/oidc_client_secret
