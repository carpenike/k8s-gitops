---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/k8s.cni.cncf.io/networkattachmentdefinition_v1.json
# Reusable macvlan for a pod that must sit on a LAN VLAN (mDNS, cameras).
# Apps reference it from any namespace. See docs/multus.md.
#
# TODO: master is not a real interface. talos/ declares no VLAN link.
# Set master to the kernel name from `ip link` (the Talos alias lan0 is
# not a kernel name). Do not attach a pod until that is done.
# Candidates recorded in the repo and not selected:
# - ens1f0 (alias lan0), 10.20.0.0/16, gateway 10.20.0.1. Node LAN and
#   Cilium's device. Not a VLAN subinterface.
# - 10.9.18.0/24. BMC network. No node interface in the Talos patches.
# - v1 bond0.30 at 10.30.10.2x/16. docs/deviations.md: not part of this
#   install, and there is no bond. The MikroTik webhook comment
#   CN=10.30.0.1 is the router certificate, not a node interface.
# TODO: ipam.routes gateway, once that VLAN's gateway is known. Same-VLAN
# destinations are reached from the prefix on the pod annotation. sbr keeps
# a later default route off Cilium's table.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: iot
spec:
  config: |-
    {
      "cniVersion": "0.3.1",
      "name": "iot",
      "plugins": [
        {
          "type": "macvlan",
          "capabilities": {"ips": true},
          "master": "TODO",
          "mode": "bridge",
          "ipam": {
            "type": "static"
          }
        },
        {
          "type": "sbr"
        }
      ]
    }
