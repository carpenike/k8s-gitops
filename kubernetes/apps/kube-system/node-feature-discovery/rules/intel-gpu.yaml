---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/nfd.k8s-sigs.io/nodefeaturerule_v1alpha1.json
# Intel VGA-compatible display controller (PCI class 0300, vendor 8086).
# NFD stores the class as the first four hex digits of the sysfs class
# file. No sled has to match. The label is how a later change finds
# /dev/dri.
apiVersion: nfd.k8s-sigs.io/v1alpha1
kind: NodeFeatureRule
metadata:
  name: intel-gpu
spec:
  rules:
    - name: intel-gpu
      labels:
        feature.node.kubernetes.io/intel-gpu: "true"
      matchFeatures:
        - feature: pci.device
          matchExpressions:
            vendor:
              op: In
              value: ["8086"]
            class:
              op: In
              value: ["0300"]
