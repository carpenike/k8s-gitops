---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Item homelab-mcp in vault k8s-secrets, plus the reader passwords from the
# postgres17 items (docs/apps/homelab-mcp.md) and the Withings app credentials
# (item homelab-mcp-withings), and homelab-mcp's own state logins and preview
# token key (item homelab-mcp-state). 27 fields at the 12h refresh: about
# 54 reads a day (docs/platform/external-secrets.md). The signing key is not here:
# the server generates it on first start and keeps it on its volume.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelab-mcp
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: homelab-mcp-env
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        HOMELAB_MCP_POCKETID_CLIENT_SECRET: "{{ .pocketid_client_secret }}"
        HOMELAB_MCP_HA_TOKEN: "{{ .ha_token }}"
        HOMELAB_MCP_HA_READ_TOKEN: "{{ .ha_read_token }}"
        # Non-admin HA user mcp-control (system-users group, local only) for
        # the HA control tools (carpenike/mcp#174). Item homelab-mcp, field
        # ha_control_token; its login password is field ha_control_password
        # (not mapped here). The value is not in git.
        HOMELAB_MCP_HA_CONTROL_TOKEN: "{{ .ha_control_token }}"
        HOMELAB_MCP_GROCY_API_KEY: "{{ .grocy_api_key }}"
        HOMELAB_MCP_PAPERLESS_TOKEN: "{{ .paperless_token }}"
        # Coach service token for /mcp/replog. Item homelab-mcp, field
        # replog_token, vault k8s-secrets. The value is not in git.
        HOMELAB_MCP_REPLOG_TOKEN: "{{ .replog_token }}"
        # Ed25519 private key that signs a 60-second on-behalf JWT per
        # RepLog call (carpenike/mcp#176). Item homelab-mcp, field
        # replog_signing_private_key. The value is not in git.
        HOMELAB_MCP_REPLOG_SIGNING_PRIVATE_KEY: "{{ .replog_signing_private_key }}"
        HOMELAB_MCP_FINANCES_SIDECAR_TOKEN: "{{ .sidecar_token }}"
        HOMELAB_MCP_FINANCES_REPO_TOKEN: "{{ .finances_repo_token }}"
        HOMELAB_MCP_FINANCES_FLOOR: "{{ .finances_floor }}"
        HOMELAB_MCP_FINANCES_AMAZON_BASELINE: "{{ .finances_amazon_baseline }}"
        HOMELAB_MCP_FINANCES_BUFFER_FLOOR: "{{ .finances_buffer_floor }}"
        HOMELAB_MCP_SNAPTRADE_CLIENT_ID: "{{ .snaptrade_client_id }}"
        HOMELAB_MCP_SNAPTRADE_CONSUMER_KEY: "{{ .snaptrade_consumer_key }}"
        HOMELAB_MCP_WITHINGS_CLIENT_ID: "{{ .withings_client_id }}"
        HOMELAB_MCP_WITHINGS_CLIENT_SECRET: "{{ .withings_client_secret }}"
        # Ledger account name -> card last four, as JSON. Exact-match
        # confidence for amazon_* needs it; kept out of this public repo.
        HOMELAB_MCP_AMAZON_ACCOUNT_LAST4: "{{ .amazon_account_last4 }}"
        # Postgres in-cluster (docs/platform/postgres17.md, "Forge stores"). Passwords
        # are URL-encoded into the DSN.
        HOMELAB_MCP_FINANCES_CONTEXT_DSN: "postgresql://finances_context:{{ .context_password | urlquery }}@postgres17-rw.cnpg-system.svc.cluster.local:5432/finances_context?sslmode=require"
        HOMELAB_MCP_MONEY_PG_DSN: "postgresql://homelab_finance_money:{{ .money_password | urlquery }}@postgres17-rw.cnpg-system.svc.cluster.local:5432/homelab_finance?sslmode=require"
        HOMELAB_MCP_SCHOOLHOUSE_DATABASE_URL: "postgresql://schoolhouse_reader:{{ .schoolhouse_password | urlquery }}@postgres17-rw.cnpg-system.svc.cluster.local:5432/schoolhouse?sslmode=require"
        HOMELAB_MCP_LADING_DATABASE_URL: "postgresql://lading_reader:{{ .lading_password | urlquery }}@postgres17-rw.cnpg-system.svc.cluster.local:5432/lading?sslmode=require"
        # The dinner planner's store (meals_*, carpenike/mcp docs/MEALS.md):
        # role meals owns database meals and its schema meals.
        HOMELAB_MCP_MEALS_PG_DSN: "postgresql://meals:{{ .meals_password | urlquery }}@postgres17-rw.cnpg-system.svc.cluster.local:5432/meals?sslmode=require"
        # homelab-mcp's own state in database homelab_mcp, one login per
        # schema (carpenike/mcp #208, #209, #213). The first start with each
        # DSN copies that store's files from the state volume, once.
        HOMELAB_MCP_OAUTH_STATE_DSN: "postgresql://homelab_mcp_oauth:{{ .oauth_password | urlquery }}@postgres17-rw.cnpg-system.svc.cluster.local:5432/homelab_mcp?sslmode=require"
        HOMELAB_MCP_GATE_CONSUMED_DSN: "postgresql://homelab_mcp_gate:{{ .gate_password | urlquery }}@postgres17-rw.cnpg-system.svc.cluster.local:5432/homelab_mcp?sslmode=require"
        HOMELAB_MCP_TOOL_STATE_DSN: "postgresql://homelab_mcp_tools:{{ .tools_password | urlquery }}@postgres17-rw.cnpg-system.svc.cluster.local:5432/homelab_mcp?sslmode=require"
        # HMAC key for preview/confirm tokens, shared by every replica so a
        # preview from one pod confirms on another. The gate refuses the
        # shared DSN without it.
        HOMELAB_MCP_GATE_TOKEN_KEY: "{{ .gate_token_key }}"
  data:
    - secretKey: pocketid_client_secret
      remoteRef:
        key: homelab-mcp/pocketid_client_secret
    - secretKey: ha_token
      remoteRef:
        key: homelab-mcp/ha_token
    - secretKey: ha_read_token
      remoteRef:
        key: homelab-mcp/ha_read_token
    - secretKey: ha_control_token
      remoteRef:
        key: homelab-mcp/ha_control_token
    - secretKey: grocy_api_key
      remoteRef:
        key: homelab-mcp/grocy_api_key
    - secretKey: paperless_token
      remoteRef:
        key: homelab-mcp/paperless_token
    - secretKey: replog_token
      remoteRef:
        key: homelab-mcp/replog_token
    - secretKey: replog_signing_private_key
      remoteRef:
        key: homelab-mcp/replog_signing_private_key
    - secretKey: sidecar_token
      remoteRef:
        key: homelab-mcp/sidecar_token
    - secretKey: finances_repo_token
      remoteRef:
        key: homelab-mcp/finances_repo_token
    - secretKey: finances_floor
      remoteRef:
        key: homelab-mcp/finances_floor
    - secretKey: finances_amazon_baseline
      remoteRef:
        key: homelab-mcp/finances_amazon_baseline
    - secretKey: finances_buffer_floor
      remoteRef:
        key: homelab-mcp/finances_buffer_floor
    - secretKey: snaptrade_client_id
      remoteRef:
        key: homelab-mcp/snaptrade_client_id
    - secretKey: snaptrade_consumer_key
      remoteRef:
        key: homelab-mcp/snaptrade_consumer_key
    - secretKey: amazon_account_last4
      remoteRef:
        key: homelab-mcp/amazon_account_last4
    - secretKey: context_password
      remoteRef:
        key: finances-context/db_password
    - secretKey: money_password
      remoteRef:
        key: homelab-finance/money_password
    - secretKey: schoolhouse_password
      remoteRef:
        key: schoolhouse/reader_password
    - secretKey: lading_password
      remoteRef:
        key: lading/reader_password
    - secretKey: meals_password
      remoteRef:
        key: meals/db_password
    - secretKey: oauth_password
      remoteRef:
        key: homelab-mcp-state/oauth_password
    - secretKey: gate_password
      remoteRef:
        key: homelab-mcp-state/gate_password
    - secretKey: tools_password
      remoteRef:
        key: homelab-mcp-state/tools_password
    - secretKey: gate_token_key
      remoteRef:
        key: homelab-mcp-state/gate_token_key
    - secretKey: withings_client_id
      remoteRef:
        key: homelab-mcp-withings/client_id
    - secretKey: withings_client_secret
      remoteRef:
        key: homelab-mcp-withings/client_secret
---
# The MyFitnessPal session, as a FILE. It is mounted, not put in the
# environment: a mounted Secret updates in place when 1Password changes and
# the server re-reads it, so a rotation needs no restart. Rotation steps:
# carpenike/mcp docs/MFP-COOKIE-RUNBOOK.md.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelab-mcp-mfp
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: homelab-mcp-mfp
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        cookies.json: "{{ .mfp_cookies }}"
  data:
    - secretKey: mfp_cookies
      remoteRef:
        key: homelab-mcp/mfp_cookies
---
# The NYT Cooking subscriber session, as a FILE, like the MFP one above:
# mounted so a 1Password change reaches the server without a restart.
# Export and rotation: carpenike/mcp docs/NYT-COOKIE-RUNBOOK.md.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelab-mcp-nyt
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: homelab-mcp-nyt
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        cookies.json: "{{ .nyt_cookies }}"
  data:
    - secretKey: nyt_cookies
      remoteRef:
        key: homelab-mcp/nyt_cookies
---
# Per-user upstream credentials, as FILES (mounted at /run/user-credentials,
# re-read on every call). Item homelab-mcp-user-credentials in vault
# k8s-secrets, one field per upstream and person named `<upstream>.<alias>`
# (alias from HOMELAB_MCP_USERS). `extract` turns every field into a key of
# the same name, so adding a person's key is adding the field; this file does
# not change. Extract, not per-field `data`: the 1Password SDK provider reads
# extracted fields from the item by label (safe with the dot in the names)
# instead of one Resolve call each (providers/v1/onepasswordsdk, v2.14.0).
# Until the item exists this is not ready and the volume stays empty (it is
# optional): per-user views refuse, shared views are unaffected.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelab-mcp-user-credentials
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: homelab-mcp-user-credentials
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: homelab-mcp-user-credentials
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The Actual sidecar's login. Its own Secret: the MCP container never sees
# the Actual password. Fields on item homelab-mcp; SIDECAR_TOKEN is the same
# value the MCP container sends.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelab-mcp-actual
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: homelab-mcp-actual
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SIDECAR_TOKEN: "{{ .sidecar_token }}"
        ACTUAL_PASSWORD: "{{ .actual_password }}"
        ACTUAL_BUDGET_SYNC_ID: "{{ .actual_budget_sync_id }}"
        ACTUAL_ENCRYPTION_PASSWORD: "{{ .actual_encryption_password }}"
  data:
    - secretKey: sidecar_token
      remoteRef:
        key: homelab-mcp/sidecar_token
    - secretKey: actual_password
      remoteRef:
        key: homelab-mcp/actual_password
    - secretKey: actual_budget_sync_id
      remoteRef:
        key: homelab-mcp/actual_budget_sync_id
    - secretKey: actual_encryption_password
      remoteRef:
        key: homelab-mcp/actual_encryption_password
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The finance jobs' environment (the scheduler container only): the export's
# write credential, which the server must never hold, the report reader, the
# sidecar and finances repo tokens the jobs share with the server, and the
# meals store for the nightly recipe-pool refresh.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelab-mcp-jobs
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: homelab-mcp-jobs
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        HOMELAB_MCP_FINANCES_SIDECAR_TOKEN: "{{ .sidecar_token }}"
        HOMELAB_MCP_FINANCES_REPO_TOKEN: "{{ .finances_repo_token }}"
        HOMELAB_MCP_FINANCES_FLOOR: "{{ .finances_floor }}"
        HOMELAB_MCP_FINANCES_AMAZON_BASELINE: "{{ .finances_amazon_baseline }}"
        HOMELAB_MCP_FINANCES_BUFFER_FLOOR: "{{ .finances_buffer_floor }}"
        # The nightly export and the snapshots write homelab_finance as its
        # owner; per-person Amazon spend reads lading.
        HOMELAB_MCP_EXPORT_PG_DSN: "postgresql://homelab_finance:{{ .export_password | urlquery }}@postgres17-rw.cnpg-system.svc.cluster.local:5432/homelab_finance?sslmode=require"
        HOMELAB_MCP_LADING_DATABASE_URL: "postgresql://lading_reader:{{ .lading_password | urlquery }}@postgres17-rw.cnpg-system.svc.cluster.local:5432/lading?sslmode=require"
        # Signal reports read money_overview and export_runs only.
        HOMELAB_MCP_FINANCES_REPORT_PG_DSN: "postgresql://homelab_finance_report:{{ .report_password | urlquery }}@postgres17-rw.cnpg-system.svc.cluster.local:5432/homelab_finance?sslmode=require"
        # homelab-meals-refresh writes the shared recipe pool and charges the
        # same NYT daily budget the server's meals_* tools do.
        HOMELAB_MCP_MEALS_PG_DSN: "postgresql://meals:{{ .meals_password | urlquery }}@postgres17-rw.cnpg-system.svc.cluster.local:5432/meals?sslmode=require"
  data:
    - secretKey: sidecar_token
      remoteRef:
        key: homelab-mcp/sidecar_token
    - secretKey: finances_repo_token
      remoteRef:
        key: homelab-mcp/finances_repo_token
    - secretKey: finances_floor
      remoteRef:
        key: homelab-mcp/finances_floor
    - secretKey: finances_amazon_baseline
      remoteRef:
        key: homelab-mcp/finances_amazon_baseline
    - secretKey: finances_buffer_floor
      remoteRef:
        key: homelab-mcp/finances_buffer_floor
    - secretKey: export_password
      remoteRef:
        key: homelab-finance/export_db_password
    - secretKey: lading_password
      remoteRef:
        key: lading/reader_password
    - secretKey: report_password
      remoteRef:
        key: homelab-finance/report_password
    - secretKey: meals_password
      remoteRef:
        key: meals/db_password
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Item homelab-mcp-signal: the bot's Signal coordinates (Forge's sops
# homelab-mcp/finance-signal-env), for the capture listener and the report
# and metrics jobs, plus the context store the listener writes notes to.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelab-mcp-signal
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: homelab-mcp-signal
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        HOMELAB_MCP_SIGNAL_NUMBER: "{{ .number }}"
        HOMELAB_MCP_SIGNAL_GROUP_ID: "{{ .group_id }}"
        HOMELAB_MCP_SIGNAL_OPS_GROUP_ID: "{{ .ops_group_id }}"
        HOMELAB_MCP_SIGNAL_BOT_UUID: "{{ .bot_uuid }}"
        HOMELAB_MCP_SIGNAL_CAPTURE_SENDERS: "{{ .capture_senders }}"
        HOMELAB_MCP_FINANCES_CONTEXT_DSN: "postgresql://finances_context:{{ .context_password | urlquery }}@postgres17-rw.cnpg-system.svc.cluster.local:5432/finances_context?sslmode=require"
  data:
    - secretKey: number
      remoteRef:
        key: homelab-mcp-signal/number
    - secretKey: group_id
      remoteRef:
        key: homelab-mcp-signal/group_id
    - secretKey: ops_group_id
      remoteRef:
        key: homelab-mcp-signal/ops_group_id
    - secretKey: bot_uuid
      remoteRef:
        key: homelab-mcp-signal/bot_uuid
    - secretKey: capture_senders
      remoteRef:
        key: homelab-mcp-signal/capture_senders
    - secretKey: context_password
      remoteRef:
        key: finances-context/db_password
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Item homelab-mcp-email: Ryan's Stalwart login and two app passwords for the
# email_* tools (carpenike/mcp docs/EMAIL.md). read_password is created with
# emailSend and the JMAP set methods disabled, write_password with emailSend
# disabled; both with allowedIps 10.42.0.0/16. The send credential is
# homelab-mcp-email-send, below. The Secret is optional in the HelmRelease.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelab-mcp-email
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: homelab-mcp-email
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        HOMELAB_MCP_EMAIL_USERNAME: "{{ .username }}"
        HOMELAB_MCP_EMAIL_READ_PASSWORD: "{{ .read_password }}"
        HOMELAB_MCP_EMAIL_WRITE_PASSWORD: "{{ .write_password }}"
  data:
    - secretKey: username
      remoteRef:
        key: homelab-mcp-email/username
    - secretKey: read_password
      remoteRef:
        key: homelab-mcp-email/read_password
    - secretKey: write_password
      remoteRef:
        key: homelab-mcp-email/write_password
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Item homelab-mcp-email-send: the ONE credential that can send as Ryan, used
# only by email_send_draft after a confirmed preview from a view in
# HOMELAB_MCP_EMAIL_SEND_VIEWS. Its own item so sending is opt-in: until it
# exists, and after it is deleted, every connector is drafts-only.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelab-mcp-email-send
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: homelab-mcp-email-send
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        HOMELAB_MCP_EMAIL_SEND_PASSWORD: "{{ .send_password }}"
  data:
    - secretKey: send_password
      remoteRef:
        key: homelab-mcp-email-send/send_password
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Item homelab-mcp-icloud: Ryan's Apple ID (username) and an app-specific
# password (password) from appleid.apple.com, for icloud_* (carpenike/mcp
# docs/ICLOUD.md). Apple cannot scope it: it also opens iCloud Mail and
# Contacts, so it is its own item and Secret, and revoking it at
# appleid.apple.com cuts only this. Optional in the HelmRelease.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelab-mcp-icloud
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: homelab-mcp-icloud
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        HOMELAB_MCP_ICLOUD_USERNAME: "{{ .username }}"
        HOMELAB_MCP_ICLOUD_PASSWORD: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: homelab-mcp-icloud/username
    - secretKey: password
      remoteRef:
        key: homelab-mcp-icloud/password
