---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Item homelab-mcp in vault k8s-secrets, plus the reader passwords from the
# postgres17 items (docs/homelab-mcp.md). At the 12h refresh that is about
# 32 reads a day (docs/external-secrets.md). The signing key is not here:
# the server generates it on first start and keeps it on its volume.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelab-mcp
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: homelab-mcp-env
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        HOMELAB_MCP_POCKETID_CLIENT_SECRET: "{{ .pocketid_client_secret }}"
        HOMELAB_MCP_HA_TOKEN: "{{ .ha_token }}"
        HOMELAB_MCP_HA_READ_TOKEN: "{{ .ha_read_token }}"
        HOMELAB_MCP_GROCY_API_KEY: "{{ .grocy_api_key }}"
        HOMELAB_MCP_PAPERLESS_TOKEN: "{{ .paperless_token }}"
        HOMELAB_MCP_FINANCES_SIDECAR_TOKEN: "{{ .sidecar_token }}"
        HOMELAB_MCP_FINANCES_REPO_TOKEN: "{{ .finances_repo_token }}"
        HOMELAB_MCP_FINANCES_FLOOR: "{{ .finances_floor }}"
        HOMELAB_MCP_FINANCES_AMAZON_BASELINE: "{{ .finances_amazon_baseline }}"
        HOMELAB_MCP_FINANCES_BUFFER_FLOOR: "{{ .finances_buffer_floor }}"
        HOMELAB_MCP_SNAPTRADE_CLIENT_ID: "{{ .snaptrade_client_id }}"
        HOMELAB_MCP_SNAPTRADE_CONSUMER_KEY: "{{ .snaptrade_consumer_key }}"
        # Ledger account name -> card last four, as JSON. Exact-match
        # confidence for amazon_* needs it; kept out of this public repo.
        HOMELAB_MCP_AMAZON_ACCOUNT_LAST4: "{{ .amazon_account_last4 }}"
        # Postgres in-cluster (docs/postgres17.md, "Forge stores"). Passwords
        # are URL-encoded into the DSN.
        HOMELAB_MCP_FINANCES_CONTEXT_DSN: "postgresql://finances_context:{{ .context_password | urlquery }}@postgres17-rw.cnpg-system.svc.cluster.local:5432/finances_context?sslmode=require"
        HOMELAB_MCP_MONEY_PG_DSN: "postgresql://homelab_finance_money:{{ .money_password | urlquery }}@postgres17-rw.cnpg-system.svc.cluster.local:5432/homelab_finance?sslmode=require"
        HOMELAB_MCP_SCHOOLHOUSE_DATABASE_URL: "postgresql://schoolhouse_reader:{{ .schoolhouse_password | urlquery }}@postgres17-rw.cnpg-system.svc.cluster.local:5432/schoolhouse?sslmode=require"
        HOMELAB_MCP_LADING_DATABASE_URL: "postgresql://lading_reader:{{ .lading_password | urlquery }}@postgres17-rw.cnpg-system.svc.cluster.local:5432/lading?sslmode=require"
  data:
    - secretKey: pocketid_client_secret
      remoteRef:
        key: homelab-mcp/pocketid_client_secret
    - secretKey: ha_token
      remoteRef:
        key: homelab-mcp/ha_token
    - secretKey: ha_read_token
      remoteRef:
        key: homelab-mcp/ha_read_token
    - secretKey: grocy_api_key
      remoteRef:
        key: homelab-mcp/grocy_api_key
    - secretKey: paperless_token
      remoteRef:
        key: homelab-mcp/paperless_token
    - secretKey: sidecar_token
      remoteRef:
        key: homelab-mcp/sidecar_token
    - secretKey: finances_repo_token
      remoteRef:
        key: homelab-mcp/finances_repo_token
    - secretKey: finances_floor
      remoteRef:
        key: homelab-mcp/finances_floor
    - secretKey: finances_amazon_baseline
      remoteRef:
        key: homelab-mcp/finances_amazon_baseline
    - secretKey: finances_buffer_floor
      remoteRef:
        key: homelab-mcp/finances_buffer_floor
    - secretKey: snaptrade_client_id
      remoteRef:
        key: homelab-mcp/snaptrade_client_id
    - secretKey: snaptrade_consumer_key
      remoteRef:
        key: homelab-mcp/snaptrade_consumer_key
    - secretKey: amazon_account_last4
      remoteRef:
        key: homelab-mcp/amazon_account_last4
    - secretKey: context_password
      remoteRef:
        key: finances-context/db_password
    - secretKey: money_password
      remoteRef:
        key: homelab-finance/money_password
    - secretKey: schoolhouse_password
      remoteRef:
        key: schoolhouse/reader_password
    - secretKey: lading_password
      remoteRef:
        key: lading/reader_password
---
# The MyFitnessPal session, as a FILE. It is mounted, not put in the
# environment: a mounted Secret updates in place when 1Password changes and
# the server re-reads it, so a rotation needs no restart. Rotation steps:
# carpenike/mcp docs/MFP-COOKIE-RUNBOOK.md.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelab-mcp-mfp
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: homelab-mcp-mfp
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        cookies.json: "{{ .mfp_cookies }}"
  data:
    - secretKey: mfp_cookies
      remoteRef:
        key: homelab-mcp/mfp_cookies
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The Actual sidecar's login. Its own Secret: the MCP container never sees
# the Actual password. Fields on item homelab-mcp; SIDECAR_TOKEN is the same
# value the MCP container sends.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelab-mcp-actual
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: homelab-mcp-actual
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SIDECAR_TOKEN: "{{ .sidecar_token }}"
        ACTUAL_PASSWORD: "{{ .actual_password }}"
        ACTUAL_BUDGET_SYNC_ID: "{{ .actual_budget_sync_id }}"
        ACTUAL_ENCRYPTION_PASSWORD: "{{ .actual_encryption_password }}"
  data:
    - secretKey: sidecar_token
      remoteRef:
        key: homelab-mcp/sidecar_token
    - secretKey: actual_password
      remoteRef:
        key: homelab-mcp/actual_password
    - secretKey: actual_budget_sync_id
      remoteRef:
        key: homelab-mcp/actual_budget_sync_id
    - secretKey: actual_encryption_password
      remoteRef:
        key: homelab-mcp/actual_encryption_password
