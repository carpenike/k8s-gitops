---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# homelab-mcp: the Claude tools server (carpenike/mcp), at mcp.${SECRET_DOMAIN}.
# One replica: OAuth state is a SQLite file and the write-confirmation gate
# keeps consumed tokens in memory. Recreate, because the volume is RWO.
#
# Views (HOMELAB_MCP_VIEWS) make several MCP URLs on this one host, each a
# protected resource of its own (carpenike/mcp src/homelab_mcp/views.py).
# Upstreams are reached over HTTPS, and the stores that used to sit in
# Forge's local Postgres are in postgres17 (docs/platform/postgres17.md, "Forge
# stores").
#
# The finance workers that ran on Forge run here too, as more containers in
# this pod, because carpenike/mcp only accepts the Actual sidecar and
# signal-api on loopback and they share one state directory with the server
# (the Signal store, the ingestion reservation, the finances checkout):
#   actual       the Actual sidecar (one login, kept up)
#   signal-api   signal-cli-rest-api, the household bot's Signal identity
#   capture      the Signal note listener
#   scheduler    supercronic: bank ingest, nightly export, snapshots, the
#                daily and weekly Signal reports, metrics (crontab below)
#   metrics      serves the jobs' finance_*.prom files on 9202
# nixos (Forge's deploy trigger) stays off. See docs/apps/homelab-mcp.md.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homelab-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: homelab-mcp
  interval: 1h
  timeout: 10m
  values:
    controllers:
      homelab-mcp:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          # Recreate keeps the route dark from SIGTERM until the new pod is
          # Ready, so every second of shutdown is a second of 503s. Every
          # container exits on SIGTERM within a few seconds (metrics on its
          # own from carpenike/mcp#205), so 10s is enough; 30s only held the old pod
          # while the kubelet waited out a process that ignored the signal.
          terminationGracePeriodSeconds: 10
          # A name with a dot is looked up as written first, so Cilium files
          # the answer under that name and the toFQDNs rules match (see the
          # same note in components/hermes-bot).
          dnsConfig:
            options:
              - name: ndots
                value: "1"
        initContainers:
          # The finance runtime refuses its state unless /var/lib/homelab-mcp
          # is owned by the pod's uid with mode exactly 0700 (the same check
          # Forge made of its dataset), and signal-cli keeps the bot's keys
          # in its own volume. A volume root is created root-owned, and
          # fsGroup would add group bits, so this sets owner and mode once per
          # start. The only step that runs as root; CHOWN and FOWNER only.
          # It also lays out the Obsidian vault volume (homelab-mcp-vault):
          # workspace/notes is the vault and workspace/.tmp the scratch dir for
          # atomic writes (outside the vault, same mount, so a rename is atomic
          # and Sync never sees a temp file); config/ holds the Sync client's
          # login and end-to-end key, mounted only into obsidian-sync; ob/ is
          # its npm install. The volume root and workspace/ stay 0755: this
          # container has no DAC_OVERRIDE, so on the next start it could not
          # search a 0700 directory owned by 65532 to reach the ones below.
          # Only config/ and .tmp/ are 0700, and it never needs to enter them.
          permissions:
            image: &mcpImage
              # Built by carpenike/mcp .github/workflows/image.yml from main
              # c1796c7, 0.88.0 (carpenike/mcp#214): worker tool proxy, off until
              # HOMELAB_MCP_WORKER_URL is set. Also carries 78c082c 0.87.0 (#213)
              # tool stores on Postgres, on via HOMELAB_MCP_TOOL_STATE_DSN, and
              # a64c165 0.86.0 (#212) stateless MCP HTTP (both also built on their
              # own). 7ce6d04 (#209) gate and 8bd7d9c (#208) OAuth state on
              # Postgres are now on via their DSNs. Digest confirmed from GHCR.
              # 1513fc2, 0.85.1 (carpenike/mcp#210): meals confirms await gate.verify.
              # Also carries, unbuilt on their own (each build cancelled by the next push):
              # 7ce6d04 0.85.0 (#209) gate consumed tokens on Postgres, off until
              # HOMELAB_MCP_GATE_CONSUMED_DSN is set (never pin 0.85.0: its meals
              # confirms skip the token check); 6c294aa/cc3495c finances config;
              # 5398bd2 0.84.0 (#206) meals_* dinner planner; 8bd7d9c (#208) OAuth
              # state on Postgres, off until HOMELAB_MCP_OAUTH_STATE_DSN is set;
              # 051a6b7 0.83.3 (#207) consent page restyle; f482006 0.83.2 (#205)
              # serve-metrics handles SIGTERM. Digest confirmed from GHCR.
              # 559c826, 0.83.1 (carpenike/mcp#204): NYT keeps bone-in, skin-on descriptors in the ingredient item.
              # 274553a, 0.83.0 (carpenike/mcp#203): NYT structured ingredient parts, byline/time casing, last_success ISO.
              # 457daf0, 0.82.4 (carpenike/mcp#202): NYT drinks filter, tag cleanup.
              # cc90a83, 0.82.3 (carpenike/mcp#201): NYT mixed numbers, paging by limit, text tidy.
              # e7f00cf, 0.82.2 (carpenike/mcp#200): NYT nutrition units, more tag filtering.
              # 1507bdb, 0.82.1 (carpenike/mcp#199): NYT parsing fixes.
              # be65355, 0.82.0 (carpenike/mcp#198): NYT search filters, nutrition,
              # tags, and nyt_save_recipe_image (egress to static01.nyt.com below).
              # 5d79c14, 0.81.1 (carpenike/mcp#197): the NYT user id also comes
              # from the nyt-jkidd cookie when regi_cookie is absent.
              # c03abf3, 0.81.0 (carpenike/mcp#196): read-only nyt_* NYT Cooking
              # tools (env, secret and egress below). Digest confirmed from GHCR.
              # 7fa82b2, 0.76.1 (carpenike/mcp#190): new filter rules go after
              # a Bulwark /* */ comment block and its requires, and the spam
              # guard header is a setting (see HOMELAB_MCP_EMAIL_SPAM_HEADER).
              # Digest confirmed from GHCR.
              # a5bbcad, 0.75.0: calendar intake (carpenike/mcp#187:
              # email_list_intake, pictures as image blocks, parsed invites)
              # and the grocy writes of carpenike/mcp#188. #187's own image
              # build was cancelled by #188's push, so this tag carries both.
              # Digest confirmed from GHCR.
              # 771f00f, 0.70.0 (carpenike/mcp#180): Withings per person. Each
              # call reads the caller's own token; `person` only with a grant;
              # tokens pinned to a Withings userid. Digest confirmed from GHCR.
              # c8b091d, 0.69.0 (carpenike/mcp#174): HA control tools behind
              # one policy (service table, entity allowlist, built-in
              # denylist), ha_activate_scene, ha_set_climate, and the
              # atrium-personal-house-control scope. Digest confirmed from GHCR.
              # (450891b: RepLog coach view and the three workout-set tools,
              # carpenike/mcp#169). Digest confirmed from GHCR for that tag.
              # e8baa55, 0.68.0: OAuth refresh rotation tolerates one lost
              # response (a replay of the newest predecessor by the same
              # client while its successor is unused), and every replay is
              # counted in homelab_mcp_oauth_refresh_replays_total.
              # 3a39b98, 0.67.1: openproject_get_task returns the full description
              # and comments.
              # 13c933e, 0.67.0: openproject_get_task returns the task's engine
              # and openproject_create_task can set it.
              # b2b1403, 0.66.4: shopping lists scale, recipe steps are returned,
              # and the recipe index is paged.
              # 0996e5b, 0.66.3: the vault rule names no areas; vault_domains lists
              # them. Includes aacc1f7, 0.66.2: the DCR response lists refresh_token
              # in grant_types.
              # e751b24, 0.66.1: the vault rule also leads vault_domains'
              # description, for clients (Hermes) that drop server instructions.
              # 4015095, 0.66.0: vault clients may be narrowed with write_paths and
              # append_paths; signal_send can be held to ops per view. Includes
              # d7a6a33, 0.65.2: decisions append to Decisions; Status is the
              # area owner_agent's.
              # f9294fe, 0.65.1: fresh-data tools point at their sync-status tool.
              # c14f6e8, 0.65.0: server instructions are the cross-family rules
              # only, vault first (1 KB, was 26 KB); family guidance moved into
              # tool descriptions. vault_domains lists each domain's folders.
              # 40b33c2, 0.64.0: vault-first rule in the server instructions;
              # a vault path through a file is not_found, not a crash.
              # 17ae140, 0.63.1: the finances_categorize audit line names the
              # calling view.
              # e1473d7, 0.63.0: vault domains may name an owner_agent, shown
              # in vault_domains.
              # 88a1bab, 0.62.2: OpenProject links use the board's public URL.
              # fa22213, 0.62.1: creates name the form's type, so OpenProject
              # keeps the Context / Done when values.
              # ab73740, 0.62.0: openproject_* pinned to a bot by connector,
              # project-tree scopes, required Context and Done when,
              # openproject_attention; vault reads audited.
              # d158acf, 0.61.0: vault writes warn about missing frontmatter;
              # vault_lint; the one-off briefing archive command, run by hand.
              # 1ce6566, 0.60.0: the vault is split into domains, and each
              # connector sees only its own (app/vault-policy.yaml); moves and
              # deletes are preview then confirm; vault_domains.
              # ad0059c, 0.59.0: vault_* read and write the Obsidian vault that
              # obsidian-sync keeps in step; every change needs the note's hash.
              # 0.58.0: withings_get_measurements and withings_trend,
              # read-only, from the scale and the blood pressure cuff.
              # 0.57.0: previews warn when a food's carbs look
              # fibre-inflated; every MFP write states nutrition_matches_preview.
              # 0.56.0: mfp_audit severity and saved meals; alcohol
              # and missing fat in the macro check; writes report what MFP
              # saved differently from the preview; merged meal adds.
              # 0.55.0: the connector icon, public at /icon.png
              # and advertised in serverInfo.icons.
              # 0.54.0: every tool has a display title.
              # 0.53.0: the staged-writes flag is gone; copying
              # entries, meal adjustments and in-place recipe updates follow
              # HOMELAB_MCP_MFP_WRITES_ENABLED like every other MFP write.
              # 0.52.0: mfp_update_recipe edits a saved recipe in place.
              # 0.51.0: mfp_log_meal adjustments and mfp_copy_entries.
              # 0.50.0: read-only mfp_audit; failed writes log MFP's reason.
              # 0.49.0: mfp_delete_meal_entries clears one meal on
              # one date with a single confirmation.
              # 0.48.1: saved-meal amounts read as fractions; the
              # macro check lets fibre count 0-4 kcal/g.
              # 0.48.0: MFP log_recipe logs any saved recipe and
              # log_meal logs a meal's separate foods, both through MFP's
              # website form; list_meals checks each food's macros.
              # 0.47.0: MFP log_recipe, log_meal, list/create/delete
              # saved meals; create/delete go through MFP's website.
              # 0.46.0: MFP confirm tokens commit only on the
              # connector that issued them, carry no readable identity, and
              # previews are no longer listed in read-only views.
              # 0.45.0: MFP write tools, preview then confirm, for diary
              # entries and recipes.
              # 0.44.0: mfp_get_recipe flags lines MFP matched at a
              # different amount; foods flag ambiguous duplicate servings.
              # 0.43.0 added read-only mfp_search_food, mfp_list_recipes and
              # mfp_get_recipe and the review fields; MFP writes stay off.
              # 0.42.1 added homelab_mcp_mfp_cookies_usable, the metric
              # HomelabMcpMfpCookiesUnusable alerts on).
              # Every container below uses this image.
              #
              # Renovate does NOT bump this: its self-built-images group
              # follows a floating tag and this pins the immutable sha- one,
              # so it is bumped by hand on every release.
              repository: ghcr.io/carpenike/homelab-mcp
              tag: sha-c1796c7bcacd8e2b6f9b71afa3b8bac0edc0a59d@sha256:62b6736a9c6eb6938b918af4f48024bf778aba87935e695983fa0140ba0fb00f
            command:
              - /bin/sh
              - -c
              - >-
                chown 65532:65532 /var/lib/homelab-mcp /signal &&
                chmod 0700 /var/lib/homelab-mcp /signal &&
                mkdir -p /vault-data/workspace/notes /vault-data/workspace/.tmp
                /vault-data/config /vault-data/ob &&
                chown 65532:65532 /vault-data /vault-data/workspace
                /vault-data/workspace/notes /vault-data/workspace/.tmp
                /vault-data/config /vault-data/ob &&
                chmod 0755 /vault-data /vault-data/workspace &&
                chmod 0700 /vault-data/config /vault-data/workspace/.tmp
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
                add:
                  - CHOWN
                  - FOWNER
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
        containers:
          app:
            image: *mcpImage
            env:
              HOMELAB_MCP_PUBLIC_BASE_URL: https://mcp.${SECRET_DOMAIN}
              HOMELAB_MCP_BIND_ADDRESS: 0.0.0.0
              HOMELAB_MCP_PORT: "9200"
              HOMELAB_MCP_METRICS_PORT: "9201"
              HOMELAB_MCP_METRICS_BIND_ADDRESS: 0.0.0.0
              HOMELAB_MCP_LOG_LEVEL: info
              # Only envoy-external reaches port 9200 (CiliumNetworkPolicy),
              # so its X-Forwarded-For is the one to trust.
              HOMELAB_MCP_TRUSTED_PROXY_IPS: "*"
              # RepLog on-behalf calls send a 60-second Ed25519 JWT signed per
              # call (carpenike/mcp#176) instead of the shared credential.
              # A missing key is a tool error, never a shared-secret fallback.
              HOMELAB_MCP_REPLOG_ON_BEHALF_PROOF: signed_jwt
              # Same Pocket ID client as Forge: its callback is this host.
              HOMELAB_MCP_POCKETID_ISSUER: https://id.${SECRET_DOMAIN}
              HOMELAB_MCP_POCKETID_CLIENT_ID: mcp
              # Gates login at the PocketID callback, BEFORE a view's own
              # `users` list is consulted -- so /mcp/steffi being scoped to
              # Stefanie is not enough on its own; she has to be here too.
              HOMELAB_MCP_OAUTH_USER_ALLOWLIST: '["ryan@ryanholt.net","stefanie@stefanieholt.com"]'
              # Redirect-URI allowlist. Setting this REPLACES the code
              # defaults, so every default is repeated here; the only addition
              # is Grok's callback, which is served from Cursor's agent
              # infrastructure (measured 2026-11-09: Grok's MCP client
              # registers as name='Cursor' and asks for exactly this URI).
              #
              # Pinned to the full callback path, not `https://www.cursor.com/`:
              # matching is a prefix check after the URL is parsed and
              # userinfo rejected, so the longer the prefix the narrower the
              # grant. This one admits that endpoint and nothing else on the
              # host. It does mean Cursor-operated infrastructure receives
              # authorization codes for whatever view the user consents to --
              # today /mcp/steffi, which carries steffi.write (grocy writes, and
              # MFP writes and deletes on her own MFP account).
              HOMELAB_MCP_OAUTH_REDIRECT_URI_ALLOWLIST: >-
                ["https://claude.ai/","https://claude.com/",
                "https://vscode.dev/redirect","https://insiders.vscode.dev/redirect",
                "http://127.0.0.1:","http://127.0.0.1/",
                "http://localhost:","http://localhost/",
                "https://www.cursor.com/agents/mcp/oauth/callback"]
              # State lives in a subdirectory the process creates 0700: the
              # private-file checks refuse a group-writable directory, and the
              # volume root is group-writable through fsGroup. The signing key
              # is generated there on first start.
              HOMELAB_MCP_OAUTH_STATE_DB_PATH: /var/lib/homelab-mcp/state/state.db
              HOMELAB_MCP_OAUTH_SIGNING_KEY_PATH: /var/lib/homelab-mcp/state/signing-key.pem
              HOMELAB_MCP_ARCRAIDERS_DB_PATH: /var/lib/homelab-mcp/state/arcraiders.db
              HOMELAB_MCP_TOOL_CATEGORIES: >-
                ["mfp", "cooklang", "ha", "grocy", "paperless", "arcraiders",
                "gatus", "fidelity", "finances", "finances_docs", "finances_loans",
                "finances_sentinel", "money", "school", "school_today",
                "amazon", "costco", "samsclub", "withings", "vault", "openproject",
                "messaging", "replog", "email", "icloud", "nyt", "meals"]
              HOMELAB_MCP_COOKLANG_BASE_URL: https://cook.${SECRET_DOMAIN}
              HOMELAB_MCP_FEDERATION_BASE_URL: https://fedcook.${SECRET_DOMAIN}
              # Grocy in the cluster (docs/apps/grocy.md), straight to the
              # Service: no gateway login, the tools send GROCY-API-KEY. The
              # grocy policy admits these pods on port 80.
              HOMELAB_MCP_GROCY_BASE_URL: http://grocy.grocy.svc.cluster.local/api
              HOMELAB_MCP_HA_BASE_URL: https://ha.${SECRET_DOMAIN}
              # What the HA control tools may actuate (carpenike/mcp#174; Ryan,
              # 2026-11-22). Applies to every view that has ha_call_service:
              # /mcp/full and /mcp/house-control. Explicit ids from a read-only
              # inventory: real lights (not Z-Wave "basic" or status-LED
              # entities), switches that are light relays or TV plugs, the
              # ecobee (climate.study; the two fireplace thermostats are not
              # listed), and media players. homelab-mcp's built-in denylist
              # (locks, covers, alarms, scripts, automations, freezers,
              # heaters, fireplaces, pumps, chargers, ...) wins over this list.
              # Setpoints 60-76 F, volume <= 0.6, hvac off refused (defaults).
              HOMELAB_MCP_HA_CONTROL_ENTITY_ALLOWLIST: >-
                [
                "light.bar_back_ceiling_1", "light.bar_ceiling_lights",
                "light.bar_ceiling_lights_switch", "light.bar_front_ceiling_1",
                "light.bar_front_ceiling_2", "light.basement_bath_hall_ceiling",
                "light.basement_bathroom_shower_light",
                "light.basement_bathroom_sink_light_left",
                "light.basement_bathroom_sink_light_right",
                "light.basement_bathroom_sink_lights",
                "light.basement_gym_wall_lights_switch", "light.basement_hutch_light",
                "light.basement_main_ceiling_back_center",
                "light.basement_main_ceiling_back_left",
                "light.basement_main_ceiling_back_right",
                "light.basement_main_ceiling_front_left",
                "light.basement_main_ceiling_front_right",
                "light.basement_main_ceiling_light_switch",
                "light.basement_main_ceiling_lights",
                "light.basement_main_ceiling_mid_left",
                "light.basement_main_ceiling_mid_right",
                "light.basement_pantry_ceiling_light",
                "light.basement_seating_ceiling_back_left",
                "light.basement_seating_ceiling_back_right",
                "light.basement_seating_ceiling_front_left",
                "light.basement_seating_ceiling_front_right",
                "light.basement_seating_ceiling_lights",
                "light.basement_seating_ceiling_lights_switch",
                "light.kitchen_bar_lights_switch", "light.living_room_all_lights",
                "light.living_room_hutch_1", "light.living_room_hutch_2",
                "light.living_room_hutch_lights", "light.master_bath_ceiling_light",
                "light.master_bathroom_ceiling_shower",
                "light.master_bathroom_counter_light",
                "light.master_closet_all_lights",
                "light.master_closet_hanging_rod_lights",
                "light.master_closet_lights_ryan_s_side",
                "light.master_closet_lights_shared_wall",
                "light.master_closet_lights_steffi_s_side",
                "light.pavilion_left_eave_light", "light.pavilion_right_eave_light",
                "light.sunroom_corner_lamp", "light.sunroom_hutch_light",
                "light.sunroom_window_lights", "light.upstairs_hallway_ceiling_lights",
                "light.upstairs_hallway_end", "light.upstairs_hallway_end_switch",
                "light.upstairs_hallway_middle", "light.upstairs_hallway_stairs",
                "light.upstairs_laundry_room_ceiling_door",
                "light.upstairs_laundry_room_ceiling_lights",
                "light.upstairs_laundry_room_ceiling_switch",
                "light.upstairs_laundry_room_ceiling_window",
                "light.upstairs_master_closet_ceiling_door",
                "light.upstairs_master_closet_ceiling_end",
                "light.upstairs_master_closet_ceiling_lights",
                "light.upstairs_master_closet_switch",
                "light.upstairs_stairwell_chandelier_light_1",
                "light.upstairs_stairwell_chandelier_light_2",
                "light.upstairs_stairwell_chandelier_light_3",
                "light.upstairs_stairwell_chandelier_light_4",
                "light.upstairs_stairwell_chandelier_light_5",
                "light.upstairs_stairwell_chandelier_lights",
                "switch.bar_under_lights", "switch.basement_bath_switch_light",
                "switch.garage_front_lights", "switch.garage_side_lights",
                "switch.main_hall_bathroom_sink_light", "switch.outdoor_lights",
                "switch.patio_lights", "switch.porch_ceiling_lights",
                "switch.sunroom_hutch_lights_relay",
                "switch.upstairs_caydan_switch_lights_ceiling",
                "switch.upstairs_caydan_switch_lights_wall",
                "switch.upstairs_jayme_switch_lights_ceiling",
                "switch.upstairs_jayme_switch_lights_wall",
                "switch.upstairs_taylor_switch_lights_ceiling",
                "switch.upstairs_taylor_switch_lights_wall",
                "switch.basement_tv_switch_relay", "switch.livingroom_tv_switch_relay",
                "climate.study", "media_player"
                ]
              # Belt and braces for entities whose ids slip past the globs.
              HOMELAB_MCP_HA_CONTROL_ENTITY_DENYLIST: >-
                ["climate.basement", "climate.living_room", "switch.study_aux_heat_only"]
              HOMELAB_MCP_PAPERLESS_BASE_URL: https://paperless.${SECRET_DOMAIN}
              # Gatus' read API; status. lets /api/v1/endpoints through without
              # the admin login (nix-config gatus.nix).
              HOMELAB_MCP_GATUS_BASE_URL: https://status.${SECRET_DOMAIN}
              # signal_send (category messaging) through the signal-api container
              # in this pod, on loopback only (Ryan, 2026-11-13).
              HOMELAB_MCP_SIGNAL_BASE_URL: http://127.0.0.1:8080
              # The bot's number and the ops group only, from Secret
              # homelab-mcp-signal: not the family group (it stays off until
              # Ryan asks) and not the rest of that Secret (capture's).
              HOMELAB_MCP_SIGNAL_NUMBER:
                valueFrom:
                  secretKeyRef:
                    name: homelab-mcp-signal
                    key: HOMELAB_MCP_SIGNAL_NUMBER
              HOMELAB_MCP_SIGNAL_OPS_GROUP_ID:
                valueFrom:
                  secretKeyRef:
                    name: homelab-mcp-signal
                    key: HOMELAB_MCP_SIGNAL_OPS_GROUP_ID
              # The Actual sidecar is the second container in this pod.
              HOMELAB_MCP_FINANCES_SIDECAR_BASE_URL: http://127.0.0.1:9210
              HOMELAB_MCP_FINANCES_REPO_URL: https://github.com/carpenike/finances.git
              HOMELAB_MCP_FINANCES_REPO_PATH: /var/lib/homelab-mcp/finances
              HOMELAB_MCP_FINANCES_STATE_PATH: /var/lib/homelab-mcp/state/finances-state.json
              # The Signal store and the local mirror of the context store;
              # the fixed path the capture and report jobs check.
              HOMELAB_MCP_FINANCES_CONTEXT_DB_PATH: /var/lib/homelab-mcp/finances-context.db
              HOMELAB_MCP_MONEY_PG_SCHEMA: household_finance
              HOMELAB_MCP_MFP_ENABLED: "true"
              HOMELAB_MCP_MFP_COOKIES_FILE: /run/mfp/cookies.json
              # NYT Cooking (carpenike/mcp#196, 0.81.0): read-only search, recipes
              # and the recipe box, as Ryan's own subscriber session (NYT-S from
