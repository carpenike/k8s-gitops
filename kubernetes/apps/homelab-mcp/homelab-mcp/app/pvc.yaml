---
# yaml-language-server: $schema=https://kubernetesjsonschema.dev/v1.18.0-standalone-strict/persistentvolumeclaim-v1.json
# The server's and the finance jobs' state: OAuth state and signing key
# (state/), the finances checkout, the Signal store (finances-context.db), the
# ingestion reservation and report state. The ingestion state and the Signal
# store are restored from Forge at the cutover (docs/apps/homelab-mcp.md). Backed
# up by ../backup.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homelab-mcp-state
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      storage: 5Gi
---
# yaml-language-server: $schema=https://kubernetesjsonschema.dev/v1.18.0-standalone-strict/persistentvolumeclaim-v1.json
# signal-cli's registration: the household bot's Signal identity keys and
# sessions. Not reproducible: losing it means re-registering the number and
# having the family group re-add the bot. Copied from Forge's
# /var/lib/signal-api at the cutover; backed up by ../backup.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homelab-mcp-signal
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      storage: 1Gi
---
# yaml-language-server: $schema=https://kubernetesjsonschema.dev/v1.18.0-standalone-strict/persistentvolumeclaim-v1.json
# The Obsidian vault, kept in step with the owner's devices by the
# obsidian-sync container and read and written by the app's vault_* tools.
# Block storage on purpose: the headless client treats a file its scan misses
# as deleted (upstream #19/#28), which a network filesystem makes likelier.
# Also holds the client's login and end-to-end key (config/, 0700) and its
# npm install (ob/). Backed up by ../backup.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homelab-mcp-vault
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      storage: 25Gi
