---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homelab-mcp
spec:
  dependsOn:
    - name: envoy-gateway
      namespace: network
    - name: external-secrets
      namespace: external-secrets
    - name: prometheus-operator-crds
      namespace: observability
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: homelab-mcp
      namespace: homelab-mcp
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: homelab-mcp
      namespace: homelab-mcp
  interval: 1h
  path: ./kubernetes/apps/homelab-mcp/homelab-mcp/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: homelab-mcp
  timeout: 10m
