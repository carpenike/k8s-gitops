---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Item replog in vault k8s-secrets. Field names match Forge's sops keys
# replog/<field> (hosts/forge/secrets.nix). No values in git.
# secret_key is a new key: the cluster database starts empty, so Forge's
# key is not copied. oidc_client_secret is copied from that sops key so
# the existing Pocket ID client keeps working. service_token is the coach
# service token (not a Forge key). The value stays in 1Password. See
# docs/apps/replog.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: replog
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: replog-env
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        REPLOG_SECRET_KEY: "{{ .secret_key }}"
        REPLOG_ADMIN_USER: "{{ .admin_user }}"
        REPLOG_ADMIN_PASS: "{{ .admin_pass }}"
        REPLOG_ADMIN_EMAIL: "{{ .admin_email }}"
        REPLOG_OIDC_CLIENT_SECRET: "{{ .oidc_client_secret }}"
        REPLOG_SERVICE_TOKEN: "{{ .service_token }}"
  data:
    - secretKey: secret_key
      remoteRef:
        key: replog/secret_key
    - secretKey: admin_user
      remoteRef:
        key: replog/admin_user
    - secretKey: admin_pass
      remoteRef:
        key: replog/admin_pass
    - secretKey: admin_email
      remoteRef:
        key: replog/admin_email
    - secretKey: oidc_client_secret
      remoteRef:
        key: replog/oidc_client_secret
    - secretKey: service_token
      remoteRef:
        key: replog/service_token
