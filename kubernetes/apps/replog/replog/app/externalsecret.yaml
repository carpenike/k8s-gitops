---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Item replog in vault k8s-secrets. Four fields at the 12h refresh.
# oidc_client_secret stays commented until MCP is turned on
# (docs/apps/replog.md). No values in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: replog
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: replog-env
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        REPLOG_SECRET_KEY: "{{ .secret_key }}"
        REPLOG_ADMIN_USER: "{{ .admin_user }}"
        REPLOG_ADMIN_PASS: "{{ .admin_pass }}"
        REPLOG_ADMIN_EMAIL: "{{ .admin_email }}"
        # Uncomment with the HelmRelease OIDC block, and add the data
        # entry below. Injected as REPLOG_OIDC_CLIENT_SECRET.
        # REPLOG_OIDC_CLIENT_SECRET: "{{ .oidc_client_secret }}"
  # When enabling MCP, add this entry next to the four above:
  #
  # - secretKey: oidc_client_secret
  #   remoteRef:
  #     key: replog/oidc_client_secret
  data:
    - secretKey: secret_key
      remoteRef:
        key: replog/secret_key
    - secretKey: admin_user
      remoteRef:
        key: replog/admin_user
    - secretKey: admin_pass
      remoteRef:
        key: replog/admin_pass
    - secretKey: admin_email
      remoteRef:
        key: replog/admin_email
