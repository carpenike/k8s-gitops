---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: replog
spec:
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: envoy-gateway
      namespace: network
    - name: external-secrets
      namespace: external-secrets
    - name: prometheus-operator-crds
      namespace: observability
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: replog
      namespace: replog
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: replog
      namespace: replog
  interval: 1h
  path: ./kubernetes/apps/replog/replog/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: replog
  timeout: 10m
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Nothing depends on this. If 1Password item volsync-r2-template cannot be
# read, this Kustomization stays unready and the server does not wait on it.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: replog-backup
spec:
  dependsOn:
    - name: replog
    - name: volsync
      namespace: volsync-system
    - name: external-secrets
      namespace: external-secrets
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: replog-volsync
      namespace: replog
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: replog-videos-volsync
      namespace: replog
  interval: 1h
  path: ./kubernetes/apps/replog/replog/backup
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: replog
  timeout: 5m
