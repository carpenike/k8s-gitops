---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
spec:
  chartRef:
    kind: OCIRepository
    name: rook-ceph
  interval: 1h
  values:
    image:
      repository: ghcr.io/rook/ceph
    monitoring:
      enabled: true
    csi:
      # Rook 1.21 always writes this key. An unset value renders empty,
      # and the operator then skips CephConnection and ClientProfile.
      # The code default is true. Driver CRs are the ceph-csi-drivers chart.
      createCsiOperatorResources: true
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits: {}
