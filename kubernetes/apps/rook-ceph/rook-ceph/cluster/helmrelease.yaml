---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
spec:
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster
  interval: 1h
  values:
    cephClusterSpec:
      cleanupPolicy:
        wipeDevicesFromOtherClusters: true
      storage:
        # Three 960GB OSD SSDs on ata6-ata8. Boot disk is ata5 (Samsung 870)
        # and does not match. Ryan approved wiping v1 Ceph on these disks.
        useAllDevices: false
        devicePathFilter: '^/dev/disk/by-path/pci-0000:00:1f\.2-ata-[678](\.0)?$'
      resources:
        osd:
          limits:
            memory: 8Gi
    monitoring:
      enabled: true
    toolbox:
      enabled: true
    cephBlockPools:
      - name: ceph-block
        spec:
          failureDomain: host
          replicated:
            size: 3
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: true
          parameters:
            imageFeatures: layering
            csi.storage.k8s.io/fstype: ext4
