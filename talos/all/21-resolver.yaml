---
# LAN resolver is the router. Search is the cluster zone only.
# Kubelet copies this search list into every pod. CoreDNS answers
# <name>.holthome.net.holthome.net with NXDOMAIN so c-ares does not
# stop on a router SERVFAIL for that doubled name.
apiVersion: v1alpha1
kind: ResolverConfig
nameservers:
  - address: 10.20.0.1
searchDomains:
  domains:
    - holthome.net
  disableDefault: true
