---
# nut-client talks to a NUT server, not to SNMP.
# Host, username, and password are placeholders. Fill them from 1Password
# at apply time. Do not commit the real MONITOR line.
# Every sled gets this same patch, so FSD powers them off together.
# The intended shutdown order (worker, then control planes) is configured
# on the NUT primary. Forge powers them back on in the reverse order
# after the battery recovers. See docs/architecture.md.
apiVersion: v1alpha1
kind: ExtensionServiceConfig
name: nut-client
configFiles:
  - content: |
      MONITOR ups@nut.example.invalid 1 upsmon secondary
      SHUTDOWNCMD "/sbin/poweroff"
    mountPath: /usr/local/etc/nut/upsmon.conf
