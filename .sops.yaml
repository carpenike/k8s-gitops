# Ryan decrypts with the OpenPGP key on his YubiKey. The fingerprint is the
# public id named user_ryan in archive/talos-v1:.sops.yaml. SOPS talks to
# gpg-agent; the private key stays on the YubiKey.
#
# Flux cannot use a YubiKey. Generate a new age identity for the cluster,
# add it in the same key_group, and re-encrypt. One group means either key
# can decrypt. Do not reuse the v1 age recipient. See docs/sops.md.
keys:
  - &user_ryan DA8002060402EC39B195451D5CED80362B5A4EF2
creation_rules:
  - path_regex: talos/.*\.sops\.ya?ml$
    mac_only_encrypted: true
    key_groups:
      - pgp:
          - *user_ryan
  - path_regex: .+\.sops\.ya?ml$
    encrypted_regex: ^(data|stringData)$
    mac_only_encrypted: true
    key_groups:
      - pgp:
          - *user_ryan
stores:
  yaml:
    indent: 2
