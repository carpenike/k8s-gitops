# Ryan decrypts with the OpenPGP key on his YubiKey. The fingerprint is the
# public id named user_ryan in archive/talos-v1:.sops.yaml. SOPS talks to
# gpg-agent; the private key stays on the YubiKey.
#
# Flux cannot use a YubiKey. The age recipient below is the new cluster
# key. Do not commit age.key, and do not reuse the v1 age recipient.
# Re-encrypt any *.sops.yaml after a recipient change. One group means
# either key can decrypt. See docs/sops.md.
keys:
  - &user_ryan DA8002060402EC39B195451D5CED80362B5A4EF2
creation_rules:
  - path_regex: talos/.*\.sops\.ya?ml$
    mac_only_encrypted: true
    key_groups:
      - pgp:
          - *user_ryan
        age:
          - age1ea86d2m34zdq4efckuc4mdez0q7hgw7x8rjw9up5msnhvxwje5esgc074h
  - path_regex: .+\.sops\.ya?ml$
    encrypted_regex: ^(data|stringData)$
    mac_only_encrypted: true
    key_groups:
      - pgp:
          - *user_ryan
        age:
          - age1ea86d2m34zdq4efckuc4mdez0q7hgw7x8rjw9up5msnhvxwje5esgc074h
stores:
  yaml:
    indent: 2
