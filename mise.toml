# Tool pins follow onedr0p/cluster-template where the plan does not override
# them. Talos and Kubernetes versions in talos/topf.yaml follow the plan
# (Talos v1.14.5, Kubernetes v1.37.1), which is newer than the template's
# talosctl pin of v1.14.4.

min_version = "2026.10.18"

[tools]
age = "1.3.2"
flux2 = "2.10.0"
helm = "4.3.1"
helmfile = "1.8.2"
kubeconform = "0.8.0"
kubectl = "1.37.2"
kustomize = "5.8.3"
sops = "3.13.3"
"github:helmfile/vals" = "v0.51.0"
talosctl = "1.14.5"
"github:postfinance/topf" = "v0.6.2"
yq = "4.54.1"

[tasks.validate]
description = "yamllint, sops check, doc links, kubeconform, helm template, gitleaks"
run = "bash scripts/validate.sh"

[tasks.kubeconform]
description = "Build each Kustomize directory and run kubeconform"
run = "bash scripts/kubeconform.sh"

[tasks.helm-template]
description = "Render each HelmRelease's values against its chart"
run = "bash scripts/helm-template.sh"

[tasks.doc-links]
description = "Check relative Markdown links, anchors, and docs/*.md mentions"
run = "bash scripts/check-doc-links.sh"

[tasks.sops-check]
description = "Reject unencrypted *.sops.yaml files"
run = "bash scripts/check-sops-encrypted.sh"

[tasks.bootstrap]
description = "Full install sequence. Refuses without --yes. Not for CI."
run = "bash scripts/bootstrap-cluster.sh all"

[tasks.bootstrap-talos]
description = "topf secrets, apply --auto-bootstrap, talosconfig, kubeconfig"
run = "bash scripts/bootstrap-cluster.sh talos"

[tasks.bootstrap-apps]
description = "sops-age, onepassword-sdk, CRDs, helmfile sync with retry"
run = "bash scripts/bootstrap-cluster.sh apps"
