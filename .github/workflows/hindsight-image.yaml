---
# Builds images/hindsight and pushes it to ghcr.io/carpenike/hindsight.
# Like hermes-screen-image.yaml (see AGENTS.md for the publishing workflows): the built-in GITHUB_TOKEN
# (packages: write), no repository secrets, and deploys nothing. Manifests pin
# the pushed digest; see AGENTS.md "Hard rules" and docs/apps/hermes.md.
name: hindsight image

on:
  push:
    paths:
      - images/hindsight/**
      - .github/workflows/hindsight-image.yaml
  workflow_dispatch:
  # Weekly rebuild for base-image and apt security fixes; Renovate then opens
  # the digest PR for the manifests. GitHub runs schedules only from the
  # default branch, so this is dormant until rebuild is the default branch.
  schedule:
    - cron: "17 6 * * 5"

permissions:
  contents: read
  packages: write

concurrency:
  group: hindsight-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Hindsight release images/hindsight/Dockerfile builds on.
  # Renovate bumps it in the same PR as the base image (packageRules in
  # .renovaterc.json5), so the image tags follow the upstream version.
  # renovate: datasource=docker depName=ghcr.io/vectorize-io/hindsight-api
  HINDSIGHT_VERSION: 1.2.1

jobs:
  build:
    name: build and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every build gets <HINDSIGHT_VERSION>-<sha>; rebuild and main also
      # move the floating <HINDSIGHT_VERSION> tag, which the manifests pin by
      # digest.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/carpenike/hindsight
          tags: |
            type=sha,prefix=${{ env.HINDSIGHT_VERSION }}-,format=short
            type=raw,value=${{ env.HINDSIGHT_VERSION }},enable=${{ github.ref == 'refs/heads/rebuild' || github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=hindsight
            org.opencontainers.image.description=Hindsight memory server (hindsight-api ${{ env.HINDSIGHT_VERSION }}) with the static-keys tenant extension

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/hindsight
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
