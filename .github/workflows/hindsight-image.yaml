---
# Builds images/hindsight and pushes it to ghcr.io/carpenike/hindsight.
# Like hermes-screen-image.yaml (see AGENTS.md for the publishing workflows): the built-in GITHUB_TOKEN
# (packages: write), no repository secrets, and deploys nothing. Manifests pin
# the pushed digest; see AGENTS.md "Hard rules" and docs/hermes.md.
name: hindsight image

on:
  push:
    paths:
      - images/hindsight/**
      - .github/workflows/hindsight-image.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: hindsight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1.2.0 is the Hindsight release the Dockerfile builds on. Every build
      # gets 1.2.0-<sha>; rebuild and main also move 1.2.0.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/carpenike/hindsight
          tags: |
            type=sha,prefix=1.2.0-,format=short
            type=raw,value=1.2.0,enable=${{ github.ref == 'refs/heads/rebuild' || github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=hindsight
            org.opencontainers.image.description=Hindsight memory server (hindsight-api 1.2.0) with the static-keys tenant extension

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/hindsight
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
