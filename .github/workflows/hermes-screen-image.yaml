---
# Builds images/hermes-screen and pushes it to ghcr.io/carpenike/hermes-screen.
# The only workflow that publishes anything: it uses the built-in GITHUB_TOKEN
# (packages: write), no repository secrets, and deploys nothing. Manifests pin
# the pushed digest; see AGENTS.md "Hard rules" and docs/hermes.md.
name: hermes-screen image

on:
  push:
    paths:
      - images/hermes-screen/**
      - .github/workflows/hermes-screen-image.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: hermes-screen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v0.22.6 is the Hermes release the Dockerfile is vendored from. Every
      # build gets v0.22.6-<sha>; rebuild and main also move v0.22.6.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/carpenike/hermes-screen
          tags: |
            type=sha,prefix=v0.22.6-,format=short
            type=raw,value=v0.22.6,enable=${{ github.ref == 'refs/heads/rebuild' || github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=hermes-screen
            org.opencontainers.image.description=Hermes screen pod: Xvnc, Xfce, headed Chromium, cua-driver, sshd as pn

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/hermes-screen
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
